<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · More-menu</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-raised: #27272a;
    --aw-surface-strong: #3f3f46;
    --aw-border-hairline: #52525b;
    --aw-text-primary: #ffffff;
    --aw-text-body: #e4e4e7;
    --aw-text-danger: #d4183d;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fs-sm: 14px;
    --aw-space-micro: 2px;
    --aw-space-row: 8px;
    --aw-space-block: 12px;
    --aw-radius-sm: 4px;
    --aw-radius-card: 8px;
    --aw-shadow-hairline: 0 1px 0 0 #0000004d;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — component — */
  .aw-menu {
    min-width: 200px; padding: var(--aw-space-row);
    border-radius: var(--aw-radius-card);
    background: var(--aw-surface-raised); border: 1px solid var(--aw-border-hairline);
    box-shadow: var(--aw-shadow-hairline);
    display: flex; flex-direction: column; gap: var(--aw-space-micro);
  }
  .aw-menu__item {
    display: flex; align-items: center; gap: var(--aw-space-block);
    padding: var(--aw-space-row) var(--aw-space-block); border-radius: var(--aw-radius-sm);
    font-size: var(--aw-fs-sm); color: var(--aw-text-body);
    text-decoration: none;
    transition: background var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-menu__item:hover { background: var(--aw-surface-strong); color: var(--aw-text-primary); }
  .aw-menu__item.is-danger { color: var(--aw-text-danger); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>

  <h1>AuctionWire · More-menu</h1>
  <div class="spec">
    <div>
      <div class="cap">Overflow menu (hover an item; .is-danger for destructive)</div>
      <div class="aw-menu" style="width:220px">
        <a class="aw-menu__item"><svg class="aw-icon" style="width:18px;height:18px" aria-hidden="true"><use href="#aw-i-bookmark"/></svg>Save search</a>
        <a class="aw-menu__item"><svg class="aw-icon" style="width:18px;height:18px" aria-hidden="true"><use href="#aw-i-bell"/></svg>Set price alert</a>
