<!doctype html>
<!--
  AuctionWire · Dots  (registry id: dots · class: .aw-dots · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-dots .aw-dot
  Contract: Foundations components/dots.md  ·  Styling source: components/dots.css (this repo) + Foundations src/tokens.css, src/base.css
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Dots</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-border-strong: #71717a;
    --aw-text-primary: #ffffff;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-space-tight: 4px;
    --aw-radius-pill: 9999px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* — component — */
  .aw-dots { display: flex; gap: var(--aw-space-tight); justify-content: center; }
  .aw-dot { width: 6px; height: 6px; border-radius: var(--aw-radius-pill); background: var(--aw-border-strong); }
  .aw-dot.is-active { background: var(--aw-text-primary); width: 16px; }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Dots</h1>
  <div class="spec">
    <div>
      <div class="cap">First / middle active</div>
      <div class="stack" style="width:120px">
        <div class="aw-dots"><span class="aw-dot is-active"></span><span class="aw-dot"></span><span class="aw-dot"></span></div>
        <div class="aw-dots"><span class="aw-dot"></span><span class="aw-dot is-active"></span><span class="aw-dot"></span><span class="aw-dot"></span></div>
      </div>
    </div>
  </div>
</body>
</html>
