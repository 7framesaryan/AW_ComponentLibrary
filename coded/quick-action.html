<!doctype html>
<!--
  AuctionWire · Quick action  (registry id: quick-action · class: .aw-quick-action · status: catalogued)

  Contract: Foundations components/quick-action.md  ·  Styling source: components/quick-action.css (this repo) + Foundations src/tokens.css, src/base.css, icons/sprite/
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Quick action</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-strong: #3f3f46;
    --aw-text-primary: #ffffff;
    --aw-text-accent: #009350;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-medium: 500;
    --aw-fs-chip: 11px;
    --aw-space-row: 8px;
    --aw-space-block: 12px;
    --aw-radius-pill: 9999px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — component — */
  .aw-quick-action {
    display: inline-flex; align-items: center; gap: var(--aw-space-row);
    height: 30px; padding: 0 var(--aw-space-block);
    border-radius: var(--aw-radius-pill);
    background: var(--aw-surface-strong); color: var(--aw-text-primary);
    font-size: var(--aw-fs-chip); font-weight: var(--aw-fw-medium);
  }
  .aw-quick-action__icon { color: var(--aw-text-accent); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 3 symbols this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

      <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v4M16 3v4"/>
      <circle cx="16" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="17.5" r="1" fill="currentColor" stroke="none"/>

      <symbol id="aw-i-radar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
    </symbol>
      <symbol id="aw-i-scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Quick action</h1>
  <div class="spec">
    <div>
      <div class="cap">Home shortcut pills</div>
      <div class="row">
        <span class="aw-quick-action"><svg class="aw-icon aw-quick-action__icon" style="width:16px;height:16px" aria-hidden="true"><use href="#aw-i-scan"/></svg>Scan card</span>
        <span class="aw-quick-action"><svg class="aw-icon aw-quick-action__icon" style="width:16px;height:16px" aria-hidden="true"><use href="#aw-i-radar"/></svg>Radar</span>
        <span class="aw-quick-action"><svg class="aw-icon aw-quick-action__icon" style="width:16px;height:16px" aria-hidden="true"><use href="#aw-i-calendar"/></svg>Calendar</span>
      </div>
    </div>
  </div>
</body>
</html>
