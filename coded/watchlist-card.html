<!doctype html>
<!--
  AuctionWire · Watchlist card  (registry id: watchlist-card · class: .aw-watchlist-card · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-watchlist-card
  Composes (rules copied for the specimen): .aw-status-chip (status-chip), .aw-listing-card (listing-card), .aw-list-row (list-row)
  Contract: Foundations components/watchlist-card.md  ·  Styling source: components/watchlist-card.css (this repo) + Foundations src/tokens.css, src/base.css, icons/sprite/
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Watchlist card</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface: #18181b;
    --aw-surface-raised: #27272a;
    --aw-accent-deep: #052c1a;
    --aw-border-hairline: #52525b;
    --aw-text-primary: #ffffff;
    --aw-text-high-alt: #f4f4f5;
    --aw-text-muted: #a1a1aa;
    --aw-text-danger: #d4183d;
    --aw-positive: #009350;
    --aw-caution: #f5a524;
    --aw-black: #000000;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-regular: 400;
    --aw-fw-medium: 500;
    --aw-fw-semibold: 600;
    --aw-fs-chip: 11px;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-fs-lg: 18px;
    --aw-space-tight: 4px;
    --aw-space-row: 8px;
    --aw-space-block: 12px;
    --aw-radius-sm: 4px;
    --aw-radius-card: 8px;
    --aw-radius-favourite: 14px;
    --aw-radius-pill: 9999px;
    --aw-shadow-soft: 0 0.5px 1px 0 #0000000d;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Element-only reset (specificity 1) so any component class always wins over it. */
  button { font: inherit; cursor: pointer; background: none; border: 0; color: inherit; }
  .aw-card-title    { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-semibold); color: var(--aw-text-high-alt); }
  .aw-price-lead    { font-size: var(--aw-fs-lg);   font-weight: var(--aw-fw-semibold); color: var(--aw-text-primary); }
  .aw-body-muted    { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-regular);  color: var(--aw-text-muted); }
  .aw-urgency       { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-medium);   color: var(--aw-text-danger); }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — composed components it sits with (from components/) — */
  .aw-status-chip {
    display: inline-flex; align-items: center; gap: var(--aw-space-tight);
    height: 24px; padding: 0 var(--aw-space-row);
    border-radius: var(--aw-radius-pill);
    font-size: var(--aw-fs-chip); font-weight: var(--aw-fw-medium);
  }
  .aw-status-chip::before { content: ""; width: 6px; height: 6px; border-radius: var(--aw-radius-pill); background: currentColor; }
  .aw-status-chip--live   { background: var(--aw-accent-deep);        color: var(--aw-positive); }
  .aw-listing-card__fav {
    position: absolute; top: 0; right: 0; width: 28px; height: 28px;
    border-radius: var(--aw-radius-favourite);
    border: 1px solid var(--aw-border-hairline);
    background: var(--aw-black);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--aw-text-primary);
  }
  .aw-list-row__thumb { width: 96px; height: 132px; object-fit: cover; background: var(--aw-surface-raised); border-radius: var(--aw-radius-sm); flex: none; }

  /* — component — */
  .aw-watchlist-card {
    border-radius: var(--aw-radius-card);
    border: 1px solid var(--aw-border-hairline);
    background: var(--aw-surface); padding: var(--aw-space-block);
    box-shadow: var(--aw-shadow-soft);
  }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 1 symbol this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-heart-filled" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 20s-7-4.35-9.5-8.5C1.1 9 2 5.5 5.2 4.8c2-.45 3.9.5 5.1 2.2 1.2-1.7 3.1-2.65 5.1-2.2C18.6 5.5 19.5 9 18 11.5 15.5 15.65 12 20 12 20Z"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Watchlist card</h1>
  <div class="spec">
    <div>
      <div class="cap">Watched lot</div>
      <div class="aw-watchlist-card">
        <div style="display:flex;gap:12px">
          <div class="aw-list-row__thumb" style="width:64px;height:88px"></div>
          <div style="flex:1;min-width:0">
            <div class="aw-card-title">1952 Topps #311 Mickey Mantle</div>
            <div class="aw-body-muted">Heritage · PSA 6</div>
            <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px"><span class="aw-price-lead" style="font-size:16px">$3,850</span><span class="aw-body-muted">(24 bids)</span></div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px"><span class="aw-urgency">Ends 02:14:37</span><span class="aw-status-chip aw-status-chip--live">Live</span></div>
          </div>
          <button type="button" class="aw-listing-card__fav" style="color:var(--aw-caution);align-self:flex-start;position:static" aria-label="Remove from watchlist"><svg class="aw-icon" style="width:15px;height:15px" aria-hidden="true"><use href="#aw-i-heart-filled"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
