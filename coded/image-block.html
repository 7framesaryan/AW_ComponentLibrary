<!doctype html>
<!--
  AuctionWire · Image block  (registry id: image-block · class: .aw-image-block · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-image-block
  Composes (rules copied for the specimen): .aw-dots (dots), .aw-dot (dots), .aw-photo
  Contract: Foundations components/image-block.md  ·  Styling source: components/image-block.css (this repo) + Foundations src/tokens.css, src/base.css, icons/sprite/
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Image block</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-raised: #27272a;
    --aw-border-strong: #71717a;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-space-tight: 4px;
    --aw-radius-sm: 4px;
    --aw-radius-pill: 9999px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — composed components it sits with (from components/) — */
  .aw-dots { display: flex; gap: var(--aw-space-tight); justify-content: center; }
  .aw-dot { width: 6px; height: 6px; border-radius: var(--aw-radius-pill); background: var(--aw-border-strong); }
  .aw-dot.is-active { background: var(--aw-text-primary); width: 16px; }
  .aw-photo { background-size: cover; background-position: center; background-color: var(--aw-surface-raised); }

  /* — component — */
  .aw-image-block { position: relative; border-radius: var(--aw-radius-sm); overflow: hidden; background: var(--aw-surface-raised); display: flex; align-items: center; justify-content: center; }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 1 symbol this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-diamond-solid" viewBox="0 0 24 24">
      <path fill="currentColor" d="M6 3h12l4 6-10 12L2 9l4-6Z"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Image block</h1>
  <div class="spec">
    <div>
      <div class="cap">Photo box (size set by the screen) + carousel dots</div>
      <div class="stack" style="width:160px">
        <div class="aw-image-block aw-photo" style="width:160px;height:120px"><svg class="aw-icon" style="width:22px;height:22px;color:var(--aw-text-muted)" aria-hidden="true"><use href="#aw-i-diamond-solid"/></svg></div>
        <div class="aw-dots"><span class="aw-dot is-active"></span><span class="aw-dot"></span><span class="aw-dot"></span></div>
      </div>
    </div>
  </div>
</body>
</html>
