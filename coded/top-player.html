<!doctype html>
<!--
  AuctionWire · Top-player card  (registry id: top-player · class: .aw-top-player · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-top-player .aw-top-player__rank
  Composes (rules copied for the specimen): .aw-avatar (avatar)
  Contract: Foundations components/top-player.md  ·  Styling source: components/top-player.css (this repo) + Foundations src/tokens.css, src/base.css, icons/sprite/
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Top-player card</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface: #18181b;
    --aw-border-hairline: #52525b;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-text-accent: #009350;
    --aw-avatar-figure: #356848;
    --aw-zinc-200: #e4e4e7;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-regular: 400;
    --aw-fw-semibold: 600;
    --aw-fw-bold: 700;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-space-row: 8px;
    --aw-radius-card: 8px;
    --aw-radius-pill: 9999px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-body-strong   { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-semibold); color: var(--aw-text-primary); }
  .aw-body-muted    { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-regular);  color: var(--aw-text-muted); }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — composed components it sits with (from components/) — */
  .aw-avatar {
    width: 32px; height: 32px; border-radius: var(--aw-radius-pill);
    background: var(--aw-zinc-200); overflow: hidden; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--aw-avatar-figure);
  }
  .aw-avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* — component — */
  .aw-top-player {
    display: flex; align-items: center; gap: var(--aw-space-row);
    padding: var(--aw-space-row);
    border-radius: var(--aw-radius-card);
    background: var(--aw-surface); border: 1px solid var(--aw-border-hairline);
  }
  .aw-top-player__rank { font-size: var(--aw-fs-xs); font-weight: var(--aw-fw-bold); color: var(--aw-text-accent); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 2 symbols this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-trend-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m4 16 5-5 3.5 3.5L20 7"/><path d="M15 7h5v5"/>
    </symbol>
      <symbol id="aw-i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/><path d="M4.5 20c1-3.5 4-5.5 7.5-5.5s6.5 2 7.5 5.5"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Top-player card</h1>
  <div class="spec">
    <div>
      <div class="cap">Ranked rows</div>
      <div class="stack">
        <div class="aw-top-player"><span class="aw-top-player__rank">#1</span><div class="aw-avatar"><svg class="aw-icon" style="width:18px;height:18px" aria-hidden="true"><use href="#aw-i-user"/></svg></div><div style="flex:1"><div class="aw-body-strong">Mickey Mantle</div><div class="aw-body-muted">1,204 lots</div></div><svg class="aw-icon" style="width:16px;height:16px;color:var(--aw-text-accent)" aria-hidden="true"><use href="#aw-i-trend-up"/></svg></div>
        <div class="aw-top-player"><span class="aw-top-player__rank">#2</span><div class="aw-avatar"><svg class="aw-icon" style="width:18px;height:18px" aria-hidden="true"><use href="#aw-i-user"/></svg></div><div style="flex:1"><div class="aw-body-strong">Michael Jordan</div><div class="aw-body-muted">986 lots</div></div><svg class="aw-icon" style="width:16px;height:16px;color:var(--aw-text-accent)" aria-hidden="true"><use href="#aw-i-trend-up"/></svg></div>
      </div>
    </div>
  </div>
</body>
</html>
