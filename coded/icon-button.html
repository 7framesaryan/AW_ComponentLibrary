<title>AuctionWire · Icon button</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-strong: #3f3f46;
    --aw-border-strong: #71717a;
    --aw-text-primary: #ffffff;
    --aw-text-secondary: #d4d4d8;
    --aw-positive: #009350;
    --aw-zinc-50: #fafafa;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-radius-button: 8px;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Element-only reset (specificity 1) so any component class always wins over it. */
  button { font: inherit; cursor: pointer; background: none; border: 0; color: inherit; }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — component — */
  /* Icon-only primary button (page-title header add/scan) */
  .aw-btn-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 43px; height: 43px; border-radius: var(--aw-radius-button);
    background: var(--aw-positive); color: var(--aw-zinc-50);
    transition: opacity var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-btn-icon:active { opacity: 0.7; }
  /* Ghost icon button — #3f3f46 fill + #71717a border */
  .aw-btn-icon-ghost {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 32px; border-radius: var(--aw-radius-button);
    background: var(--aw-surface-strong); border: 1px solid var(--aw-border-strong);
    color: var(--aw-text-secondary);
    transition: opacity var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-btn-icon-ghost:active { opacity: 0.7; }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
