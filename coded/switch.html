<!--
  AuctionWire · Switch  (registry id: switch · class: .aw-switch · status: catalogued)

  Contract: Foundations components/switch.md  ·  Styling source: components/switch.css (this repo) + Foundations src/tokens.css, src/base.css
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Switch</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-strong: #3f3f46;
    --aw-text-primary: #ffffff;
    --aw-positive: #009350;
    --aw-zinc-50: #fafafa;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fs-xs: 12px;
    --aw-space-row: 8px;
    --aw-radius-pill: 9999px;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* — component — */
  .aw-switch { display: inline-flex; align-items: center; gap: var(--aw-space-row); }
  .aw-switch__track {
    width: 40px; height: 24px; border-radius: var(--aw-radius-pill);
    background: var(--aw-surface-strong); position: relative;
    transition: background var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-switch__thumb {
    position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    border-radius: var(--aw-radius-pill); background: var(--aw-zinc-50);
    transition: transform var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-switch.is-on .aw-switch__track { background: var(--aw-positive); }
  .aw-switch.is-on .aw-switch__thumb { transform: translateX(16px); }
  .aw-switch__label { font-size: var(--aw-fs-xs); color: var(--aw-text-primary); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Switch</h1>
  <div class="spec">
    <div>
      <div class="cap">On (.is-on) &amp; off</div>
      <div class="stack">
        <label class="aw-switch is-on"><span class="aw-switch__track"><span class="aw-switch__thumb"></span></span><span class="aw-switch__label">Auto-bid</span></label>
        <label class="aw-switch"><span class="aw-switch__track"><span class="aw-switch__thumb"></span></span><span class="aw-switch__label">Outbid alerts</span></label>
      </div>
    </div>
  </div>
</body>
</html>
