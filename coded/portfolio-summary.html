<!doctype html>
<!--
  AuctionWire · Portfolio summary  (registry id: portfolio-summary · class: .aw-portfolio-summary · status: catalogued)

  so it drops straight into a Claude artifact without the whole token file.

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Portfolio summary</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface: #18181b;
    --aw-border-hairline: #52525b;
    --aw-border-subtle: #27272a;
    --aw-text-primary: #ffffff;
    --aw-text-high-alt: #f4f4f5;
    --aw-text-muted: #a1a1aa;
    --aw-text-accent: #009350;
    --aw-text-danger: #d4183d;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-regular: 400;
    --aw-fw-semibold: 600;
    --aw-fw-bold: 700;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-fs-base: 16px;
    --aw-lh-base: 24px;
    --aw-fs-lg: 18px;
    --aw-space-micro: 2px;
    --aw-space-row: 8px;
    --aw-space-block: 12px;
    --aw-space-section: 16px;
    --aw-radius-card: 8px;
    --aw-shadow-soft: 0 0.5px 1px 0 #0000000d;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-portfolio-value { font-size: var(--aw-fs-lg); font-weight: var(--aw-fw-bold);   color: var(--aw-text-high-alt); }
  .aw-stat-value    { font-size: var(--aw-fs-base); line-height: var(--aw-lh-base);  font-weight: var(--aw-fw-bold);   color: var(--aw-text-primary); }
  .aw-body-muted    { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-regular);  color: var(--aw-text-muted); }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — composed components it sits with (from components/) — */
  .aw-divider { height: 1px; background: var(--aw-border-subtle); border: 0; margin: var(--aw-space-section) 0; }

  /* — component — */
  .aw-portfolio-summary {
    border-radius: var(--aw-radius-card);
    background: var(--aw-surface); border: 1px solid var(--aw-border-hairline);
    box-shadow: var(--aw-shadow-soft);
    padding: var(--aw-space-section);
    display: flex; flex-direction: column; gap: var(--aw-space-block);
  }
  .aw-portfolio-summary__head { display: flex; align-items: baseline; gap: var(--aw-space-row); }
  .aw-portfolio-summary__delta { font-size: var(--aw-fs-xs); font-weight: var(--aw-fw-semibold); color: var(--aw-text-accent); }
  .aw-portfolio-summary__delta.is-down { color: var(--aw-text-danger); }
  .aw-portfolio-summary__stats { display: flex; gap: var(--aw-space-section); }
  .aw-portfolio-summary__stat { flex: 1; display: flex; flex-direction: column; gap: var(--aw-space-micro); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 1 symbol this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-trend-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m4 16 5-5 3.5 3.5L20 7"/><path d="M15 7h5v5"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Portfolio summary</h1>
  <div class="spec">
    <div>
      <div class="cap">Up</div>
      <div class="aw-portfolio-summary">
        <div>
          <div class="aw-body-muted">Portfolio value</div>
          <div class="aw-portfolio-summary__head"><span class="aw-portfolio-value">$142,380</span><span class="aw-portfolio-summary__delta"><svg class="aw-icon" style="width:12px;height:12px" aria-hidden="true"><use href="#aw-i-trend-up"/></svg> +4.2%</span></div>
        </div>
        <div class="aw-divider" style="margin:2px 0"></div>
        <div class="aw-portfolio-summary__stats">
          <div class="aw-portfolio-summary__stat"><span class="aw-body-muted">Cards</span><span class="aw-stat-value">128</span></div>
          <div class="aw-portfolio-summary__stat"><span class="aw-body-muted">Watching</span><span class="aw-stat-value">12</span></div>
          <div class="aw-portfolio-summary__stat"><span class="aw-body-muted">Active bids</span><span class="aw-stat-value">5</span></div>
        </div>
      </div>
    </div>
    <div>
      <div class="cap">Down (.is-down on the delta)</div>
      <div class="aw-portfolio-summary">
        <div>
          <div class="aw-body-muted">Portfolio value</div>
          <div class="aw-portfolio-summary__head"><span class="aw-portfolio-value">$138,910</span><span class="aw-portfolio-summary__delta is-down">−2.4%</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
