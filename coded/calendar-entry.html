<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Calendar entry</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface: #18181b;
    --aw-accent-deep: #052c1a;
    --aw-accent-warning-soft: #1f1706;
    --aw-border-hairline: #52525b;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-text-accent: #009350;
    --aw-positive: #009350;
    --aw-caution: #f5a524;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-regular: 400;
    --aw-fw-medium: 500;
    --aw-fw-semibold: 600;
    --aw-fs-chip: 11px;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-space-tight: 4px;
    --aw-space-row: 8px;
    --aw-space-block: 12px;
    --aw-radius-card: 8px;
    --aw-radius-pill: 9999px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-body-strong   { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-semibold); color: var(--aw-text-primary); }
  .aw-body-muted    { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-regular);  color: var(--aw-text-muted); }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — composed components it sits with (from components/) — */
  .aw-status-chip {
    display: inline-flex; align-items: center; gap: var(--aw-space-tight);
    height: 24px; padding: 0 var(--aw-space-row);
    border-radius: var(--aw-radius-pill);
    font-size: var(--aw-fs-chip); font-weight: var(--aw-fw-medium);
  }
  .aw-status-chip::before { content: ""; width: 6px; height: 6px; border-radius: var(--aw-radius-pill); background: currentColor; }
  .aw-status-chip--live   { background: var(--aw-accent-deep);        color: var(--aw-positive); }
  .aw-status-chip--upcoming{ background: var(--aw-accent-warning-soft); color: var(--aw-caution); }

  /* — component — */
  .aw-calendar-entry {
    display: flex; align-items: center; justify-content: space-between; gap: var(--aw-space-block);
    padding: var(--aw-space-block);
    border-radius: var(--aw-radius-card);
    border: 1px solid var(--aw-border-hairline); background: var(--aw-surface);
  }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 1 symbol this component uses (from the Foundations icons/sprite/) -->

      <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v4M16 3v4"/>
      <circle cx="16" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="17.5" r="1" fill="currentColor" stroke="none"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Calendar entry</h1>
  <div class="spec">
    <div>
      <div class="cap">Live &amp; upcoming</div>
      <div class="stack">
        <div class="aw-calendar-entry"><div style="display:flex;align-items:center;gap:12px"><svg class="aw-icon" style="width:18px;height:18px;color:var(--aw-text-accent)" aria-hidden="true"><use href="#aw-i-calendar"/></svg><div><div class="aw-body-strong">Goldin Monthly</div><div class="aw-body-muted">Feb 20 – Feb 27</div></div></div><span class="aw-status-chip aw-status-chip--live">Live Now</span></div>
        <div class="aw-calendar-entry"><div style="display:flex;align-items:center;gap:12px"><svg class="aw-icon" style="width:18px;height:18px;color:var(--aw-text-accent)" aria-hidden="true"><use href="#aw-i-calendar"/></svg><div><div class="aw-body-strong">Heritage Sports Signature</div><div class="aw-body-muted">Mar 3 – Mar 9</div></div></div><span class="aw-status-chip aw-status-chip--upcoming">Upcoming</span></div>
      </div>
    </div>
  </div>
</body>
</html>
