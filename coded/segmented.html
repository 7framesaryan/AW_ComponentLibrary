<!doctype html>
<!--
  AuctionWire · Segmented  (registry id: segmented · class: .aw-segmented · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-segmented .aw-segmented__opt
  Contract: Foundations components/segmented.md  ·  Styling source: components/segmented.css (this repo) + Foundations src/tokens.css, src/base.css, icons/sprite/
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Segmented</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-raised: #27272a;
    --aw-surface-strong: #3f3f46;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-medium: 500;
    --aw-fs-chip: 11px;
    --aw-space-micro: 2px;
    --aw-space-tight: 4px;
    --aw-space-block: 12px;
    --aw-radius-pill: 9999px;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — component — */
  .aw-segmented { display: inline-flex; padding: var(--aw-space-micro); border-radius: var(--aw-radius-pill); background: var(--aw-surface-raised); }
  .aw-segmented__opt {
    display: inline-flex; align-items: center; gap: var(--aw-space-tight);
    padding: var(--aw-space-tight) var(--aw-space-block); border-radius: var(--aw-radius-pill);
    font-size: var(--aw-fs-chip); font-weight: var(--aw-fw-medium); color: var(--aw-text-muted);
    transition: background var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-segmented__opt.is-active { background: var(--aw-surface-strong); color: var(--aw-text-primary); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 2 symbols this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
      <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
    </symbol>
      <symbol id="aw-i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Segmented</h1>
  <div class="spec">
    <div>
      <div class="cap">List / Grid, one .is-active</div>
      <div class="aw-segmented"><span class="aw-segmented__opt is-active"><svg class="aw-icon" style="width:14px;height:14px" aria-hidden="true"><use href="#aw-i-list"/></svg>List</span><span class="aw-segmented__opt"><svg class="aw-icon" style="width:14px;height:14px" aria-hidden="true"><use href="#aw-i-grid"/></svg>Grid</span></div>
    </div>
  </div>
</body>
</html>
