<!doctype html>
<!--
  AuctionWire · Chip  (registry id: chip · class: .aw-chip · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-chip .aw-chip--sm .aw-chip--primary
  Composes (rules copied for the specimen): .aw-listing-card (listing-card)
  Contract: Foundations components/chip.md  ·  Styling source: components/chip.css (this repo) + Foundations src/tokens.css, src/base.css, icons/sprite/
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Chip</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-raised: #27272a;
    --aw-accent-chip-bg: #17251d;
    --aw-text-primary: #ffffff;
    --aw-text-secondary: #d4d4d8;
    --aw-text-accent: #009350;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-medium: 500;
    --aw-fs-chip: 11px;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-space-tight: 4px;
    --aw-space-row: 8px;
    --aw-radius-md: 6px;
    --aw-radius-pill: 9999px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — composed components it sits with (from components/) — */
  .aw-listing-card__pills { display: flex; align-items: center; gap: var(--aw-space-row); }

  /* — component — */
  /* Price / grade pill — raised surface #27272a, r6 (measured), icon + value.
     24px tall: gem/text 12px, 8px horizontal / 4px vertical padding, gap 4. */
  .aw-chip {
    display: inline-flex; align-items: center; gap: var(--aw-space-tight);
    height: 24px; padding: 0 var(--aw-space-row);
    border-radius: var(--aw-radius-md);
    background: var(--aw-surface-raised);
    font-size: var(--aw-fs-xs); line-height: var(--aw-lh-xs);
    font-weight: var(--aw-fw-medium); color: var(--aw-text-primary);
  }
  /* Small chip — category / tag */
  .aw-chip--sm { padding: var(--aw-space-tight) var(--aw-space-row); font-size: var(--aw-fs-chip); border-radius: var(--aw-radius-pill); }
  .aw-chip--primary { background: var(--aw-accent-chip-bg); color: var(--aw-text-accent); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 1 symbol this component uses (from the Foundations icons/sprite/) -->

    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Chip</h1>
  <div class="spec">
    <div>
      <div class="cap">Price / grade pill (default)</div>
      <div class="aw-listing-card__pills"><span class="aw-chip"><svg class="aw-icon" style="width:15px;height:15px;color:var(--aw-text-secondary)" aria-hidden="true"><use href="#aw-i-gem"/></svg>$4,200</span><span class="aw-chip">PSA 6</span></div>
    </div>
    <div>
      <div class="cap">Small — category / tag</div>
      <div class="row"><span class="aw-chip aw-chip--sm">Baseball</span><span class="aw-chip aw-chip--sm">Rookie</span></div>
    </div>
    <div>
      <div class="cap">Primary (green-tinted)</div>
      <div class="row"><span class="aw-chip aw-chip--primary">Verified</span><span class="aw-chip aw-chip--sm aw-chip--primary">New</span></div>
    </div>
  </div>
</body>
</html>
