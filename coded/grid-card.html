<!doctype html>
<!--
  AuctionWire · PLP grid card  (registry id: grid-card · class: .aw-grid-card · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-grid-card .aw-grid-card__media .aw-grid-card__title
  Composes (rules copied for the specimen): .aw-status-chip (status-chip)
  Contract: Foundations components/grid-card.md  ·  Styling source: components/grid-card.css (this repo) + Foundations src/tokens.css, src/base.css
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · PLP grid card</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-raised: #27272a;
    --aw-surface-translucent: #00000066;
    --aw-accent-deep: #052c1a;
    --aw-accent-warning-soft: #1f1706;
    --aw-text-primary: #ffffff;
    --aw-text-high-alt: #f4f4f5;
    --aw-positive: #009350;
    --aw-caution: #f5a524;
    --aw-zinc-600: #52525b;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-medium: 500;
    --aw-fw-semibold: 600;
    --aw-fs-chip: 11px;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-fs-lg: 18px;
    --aw-space-tight: 4px;
    --aw-space-row: 8px;
    --aw-grid-columns: 4;
    --aw-grid-margin: 16px;
    --aw-grid-gutter: 8px;
    --aw-radius-sm: 4px;
    --aw-radius-card: 8px;
    --aw-radius-pill: 9999px;
    --aw-shadow-hairline: 0 1px 0 0 #0000004d;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-card-title    { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-semibold); color: var(--aw-text-high-alt); }
  .aw-price-lead    { font-size: var(--aw-fs-lg);   font-weight: var(--aw-fw-semibold); color: var(--aw-text-primary); }
  .aw-grid { display: grid; grid-template-columns: repeat(var(--aw-grid-columns), minmax(0, 1fr)); column-gap: var(--aw-grid-gutter); padding-inline: var(--aw-grid-margin); }
  .aw-col-2 { grid-column: span 2; }

  /* — composed components it sits with (from components/) — */
  .aw-status-chip {
    display: inline-flex; align-items: center; gap: var(--aw-space-tight);
    height: 24px; padding: 0 var(--aw-space-row);
    border-radius: var(--aw-radius-pill);
    font-size: var(--aw-fs-chip); font-weight: var(--aw-fw-medium);
  }
  .aw-status-chip::before { content: ""; width: 6px; height: 6px; border-radius: var(--aw-radius-pill); background: currentColor; }
  .aw-status-chip--live   { background: var(--aw-accent-deep);        color: var(--aw-positive); }
  .aw-status-chip--upcoming{ background: var(--aw-accent-warning-soft); color: var(--aw-caution); }

  /* — component — */
  .aw-grid-card {
    width: 100%; /* fills its column span: 2 columns = 181px on the 402px screen */ padding: var(--aw-space-row);
    border-radius: var(--aw-radius-card);
    border: 1px solid var(--aw-zinc-600);
    background: var(--aw-surface-translucent);
    box-shadow: var(--aw-shadow-hairline);
    display: flex; flex-direction: column; gap: var(--aw-space-row);
  }
  .aw-grid-card__media { position: relative; width: 100%; height: 120px; display: flex; align-items: center; justify-content: center; background: var(--aw-surface-raised); border-radius: var(--aw-radius-sm); }
  .aw-grid-card__title { color: var(--aw-text-high-alt); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · PLP grid card</h1>
  <div class="spec">
    <div>
      <div class="cap">2-up on the 4-column grid (2-column spans)</div>
      <div class="aw-grid" style="padding-inline:0">
        <article class="aw-grid-card aw-col-2"><div class="aw-grid-card__media"></div><div class="aw-grid-card__title aw-card-title">1952 Topps Mantle</div><div style="display:flex;justify-content:space-between;align-items:center"><span class="aw-price-lead">$3,850</span><span class="aw-status-chip aw-status-chip--live">Live</span></div></article>
        <article class="aw-grid-card aw-col-2"><div class="aw-grid-card__media"></div><div class="aw-grid-card__title aw-card-title">1953 Bowman Mantle</div><div style="display:flex;justify-content:space-between;align-items:center"><span class="aw-price-lead">$5,100</span><span class="aw-status-chip aw-status-chip--upcoming">Soon</span></div></article>
      </div>
    </div>
  </div>
</body>
</html>
