<title>AuctionWire · Bottom nav</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-nav-pill: #4b4b4b66;
    --aw-surface-nav-active: #1e68131f;
    --aw-border-glass-bright: #ffffff38;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-text-accent: #009350;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-font-nav: -apple-system, "SF Pro Text", system-ui, sans-serif;
    --aw-fw-medium: 500;
    --aw-fs-caption: 10px;
    --aw-space-micro: 2px;
    --aw-space-tight: 4px;
    --aw-space-row: 8px;
    --aw-space-block: 12px;
    --aw-radius-button: 8px;
    --aw-radius-nav-pill: 16px;
    --aw-glass-blur-nav: 20px;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-glass-nav {
    background: var(--aw-surface-nav-pill);
    backdrop-filter: blur(var(--aw-glass-blur-nav));
    -webkit-backdrop-filter: blur(var(--aw-glass-blur-nav));
    border: 1px solid var(--aw-border-glass-bright);
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — component — */
  .aw-bottom-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--aw-space-tight); padding: var(--aw-space-row);
    border-radius: var(--aw-radius-nav-pill);
  }
  .aw-nav-item {
    display: flex; flex-direction: column; align-items: center; gap: var(--aw-space-micro);
    padding: var(--aw-space-row) var(--aw-space-block);
    border-radius: var(--aw-radius-button);
    color: var(--aw-text-muted); font-family: var(--aw-font-nav);
    font-size: var(--aw-fs-caption); font-weight: var(--aw-fw-medium);
    text-decoration: none;
    transition: color var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-nav-item.is-active { color: var(--aw-text-accent); background: var(--aw-surface-nav-active); }

  /* template-local wrapper — floats the pill near the bottom of a screen */
  .float-nav { display: flex; justify-content: center; }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
  body { background: radial-gradient(120% 80% at 50% 100%, #0b1a10 0%, var(--aw-bg) 60%); }
</style>
</head>
