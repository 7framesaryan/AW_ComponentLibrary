<!doctype html>
<!--
  AuctionWire · Radio  (registry id: radio · class: .aw-radio · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-radio .aw-radio__dot .aw-radio--ring
  Contract: Foundations components/radio.md  ·  Styling source: components/radio.css (this repo) + Foundations src/tokens.css, src/base.css
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Radio</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-border-strong: #71717a;
    --aw-text-primary: #ffffff;
    --aw-positive: #009350;
    --aw-zinc-50: #fafafa;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-radius-pill: 9999px;
    --aw-radio-dot-size: 10px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* — component — */
  /* split from the shared rule ".aw-checkbox, .aw-radio" */
  .aw-radio {
    width: 20px; height: 20px; border: 1px solid var(--aw-border-strong);
    background: transparent; display: inline-flex; align-items: center; justify-content: center;
    color: var(--aw-zinc-50);
  }
  .aw-radio { border-radius: var(--aw-radius-pill); }
  /* split from the shared rule ".aw-checkbox.is-checked, .aw-radio.is-checked" */
  .aw-radio.is-checked { background: var(--aw-positive); border-color: var(--aw-positive); }
  /* Radio ring variant: keeps a transparent centre with an inner dot when checked
     (donut), instead of the default solid-fill checked state. */
  .aw-radio__dot { width: var(--aw-radio-dot-size); height: var(--aw-radio-dot-size); border-radius: var(--aw-radius-pill); background: transparent; }
  .aw-radio--ring.is-checked { background: transparent; border-color: var(--aw-positive); }
  .aw-radio--ring.is-checked .aw-radio__dot { background: var(--aw-positive); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Radio</h1>
  <div class="spec">
    <div>
      <div class="cap">Default — solid fill when checked</div>
      <div class="row"><span class="aw-radio is-checked"></span><span class="aw-radio"></span></div>
    </div>
    <div>
      <div class="cap">Ring (.aw-radio--ring) — donut when checked</div>
      <div class="row">
        <span class="aw-radio aw-radio--ring is-checked" aria-hidden="true"><span class="aw-radio__dot"></span></span>
        <span class="aw-radio aw-radio--ring" aria-hidden="true"><span class="aw-radio__dot"></span></span>
      </div>
    </div>
  </div>
</body>
</html>
