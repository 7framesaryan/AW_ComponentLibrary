<!doctype html>
<!--
  AuctionWire · Calendar strip  (registry id: calendar-strip · class: .aw-calendar-strip · status: catalogued)

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Calendar strip</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface: #18181b;
    --aw-accent-deep: #052c1a;
    --aw-border-hairline: #52525b;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-text-accent: #009350;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-regular: 400;
    --aw-fw-bold: 700;
    --aw-fs-caption: 10px;
    --aw-lh-caption: 16px;
    --aw-fs-base: 16px;
    --aw-lh-base: 24px;
    --aw-space-micro: 2px;
    --aw-space-tight: 4px;
    --aw-space-row: 8px;
    --aw-space-block: 12px;
    --aw-radius-card: 8px;
    --aw-radius-button: 8px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-stat-value    { font-size: var(--aw-fs-base); line-height: var(--aw-lh-base);  font-weight: var(--aw-fw-bold);   color: var(--aw-text-primary); }
  .aw-caption       { font-size: var(--aw-fs-caption); line-height: var(--aw-lh-caption); font-weight: var(--aw-fw-regular); color: var(--aw-text-muted); }

  /* — component — */
  .aw-calendar-strip {
    display: flex; gap: var(--aw-space-row);
    border-radius: var(--aw-radius-card);
    background: var(--aw-surface); border: 1px solid var(--aw-border-hairline);
    padding: var(--aw-space-block); overflow-x: auto;
  }
  .aw-calendar-day {
    display: flex; flex-direction: column; align-items: center; gap: var(--aw-space-micro);
    min-width: 44px; padding: var(--aw-space-row) var(--aw-space-tight);
    border-radius: var(--aw-radius-button);
  }
  .aw-calendar-day.is-active { background: var(--aw-accent-deep); color: var(--aw-text-accent); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Calendar strip</h1>
  <div class="spec">
    <div>
      <div class="cap">Strip of days — includes folded calendar-day, one .is-active</div>
      <div class="aw-calendar-strip">
        <div class="aw-calendar-day"><span class="aw-caption">MON</span><span class="aw-stat-value" style="font-size:14px">10</span></div>
        <div class="aw-calendar-day is-active"><span class="aw-caption">TUE</span><span class="aw-stat-value" style="font-size:14px">11</span></div>
        <div class="aw-calendar-day"><span class="aw-caption">WED</span><span class="aw-stat-value" style="font-size:14px">12</span></div>
        <div class="aw-calendar-day"><span class="aw-caption">THU</span><span class="aw-stat-value" style="font-size:14px">13</span></div>
        <div class="aw-calendar-day"><span class="aw-caption">FRI</span><span class="aw-stat-value" style="font-size:14px">14</span></div>
        <div class="aw-calendar-day"><span class="aw-caption">SAT</span><span class="aw-stat-value" style="font-size:14px">15</span></div>
        <div class="aw-calendar-day"><span class="aw-caption">SUN</span><span class="aw-stat-value" style="font-size:14px">16</span></div>
      </div>
    </div>
  </div>
</body>
</html>
