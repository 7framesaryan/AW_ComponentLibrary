<!doctype html>
<!--
  AuctionWire · Screen  (registry id: screen · class: .aw-screen · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-screen
  Composes (rules copied for the specimen): .aw-section-header (section-header), .aw-icon
  Contract: Foundations components/screen.md  ·  Styling source: components/screen.css (this repo) + Foundations src/tokens.css, src/base.css, icons/sprite/
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Screen</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-text-primary: #ffffff;
    --aw-text-secondary: #d4d4d8;
    --aw-text-accent: #009350;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-semibold: 600;
    --aw-fs-xs: 12px;
    --aw-fs-base: 16px;
    --aw-space-tight: 4px;
    --aw-space-block: 12px;
    --aw-space-section: 16px;
    --aw-grid-columns: 4;
    --aw-grid-margin: 16px;
    --aw-grid-gutter: 8px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-section-title-lg { font-size: var(--aw-fs-base); font-weight: var(--aw-fw-semibold); color: var(--aw-text-secondary); }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }
  .aw-grid { display: grid; grid-template-columns: repeat(var(--aw-grid-columns), minmax(0, 1fr)); column-gap: var(--aw-grid-gutter); padding-inline: var(--aw-grid-margin); }
  .aw-col-1 { grid-column: span 1; }
  .aw-col-2 { grid-column: span 2; }
  .aw-col-3 { grid-column: span 3; }
  .aw-col-4 { grid-column: span 4; }
  /* Inside .aw-screen the screen already provides the 16px grid margin, so the grid adds only columns + gutter. */
  .aw-screen .aw-grid { padding-inline: 0; }

  /* — composed components it sits with (from components/) — */
  .aw-section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--aw-space-block);
  }
  .aw-section-header__action {
    display: inline-flex; align-items: center; gap: var(--aw-space-tight);
    font-size: var(--aw-fs-xs); color: var(--aw-text-primary);
    text-decoration: none;
  }
  .aw-section-header__action .aw-icon { color: var(--aw-text-accent); }

  /* — component — */
  .aw-screen {
    background: var(--aw-bg);
    min-height: 100%;
    padding: 0 var(--aw-space-section);
  }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
  .demo-col { margin-top: 8px; height: 32px; border-radius: 4px; background: #27272a; color: #a1a1aa; font-size: 11px; display: grid; place-items: center; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 1 symbol this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 5 7 7-7 7"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Screen</h1>
  <div class="spec">
    <div>
      <div class="cap">Screen (16px margin) + 4-column grid inside</div>
      <main class="aw-screen" style="padding-top:16px;padding-bottom:16px;outline:1px dashed #3f3f46">
        <div class="aw-grid">
          <section class="aw-col-4">
            <div class="aw-section-header"><span class="aw-section-title-lg">Top players</span><a class="aw-section-header__action">See all <svg class="aw-icon" style="width:14px;height:14px" aria-hidden="true"><use href="#aw-i-chevron-right"/></svg></a></div>
          </section>
          <div class="aw-col-2 demo-col">2 cols</div><div class="aw-col-2 demo-col">2 cols</div>
          <div class="aw-col-1 demo-col">1</div><div class="aw-col-3 demo-col">3 cols</div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
