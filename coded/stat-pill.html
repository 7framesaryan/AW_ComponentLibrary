<!doctype html>
<!--
  AuctionWire · Stat pill  (registry id: stat-pill · class: .aw-stat-pill · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-stat-pill .aw-stat-pill__label .aw-stat-pill__value
  Contract: Foundations components/stat-pill.md  ·  Styling source: components/stat-pill.css (this repo) + Foundations src/tokens.css, src/base.css, icons/sprite/
  GENERATED by scripts/build-mirrors.mjs — rules are byte-identical to the component CSS; edit that, never this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Stat pill</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-raised: #27272a;
    --aw-text-primary: #ffffff;
    --aw-text-body: #e4e4e7;
    --aw-text-accent: #009350;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-bold: 700;
    --aw-fs-xs: 12px;
    --aw-fs-base: 16px;
    --aw-lh-base: 24px;
    --aw-space-row: 8px;
    --aw-space-block: 12px;
    --aw-radius-button: 8px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — component — */
  .aw-stat-pill {
    display: inline-flex; align-items: center; gap: var(--aw-space-row);
    height: 40px; padding: 0 var(--aw-space-block);
    border-radius: var(--aw-radius-button);
    background: var(--aw-surface-raised);
  }
  .aw-stat-pill__label { font-size: var(--aw-fs-xs); color: var(--aw-text-body); }
  .aw-stat-pill__value { font-size: var(--aw-fs-base); line-height: var(--aw-lh-base); font-weight: var(--aw-fw-bold); color: var(--aw-text-primary); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 2 symbols this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-gavel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m14.5 9.5 5 5"/><path d="m6.5 6.5 4 4-2.5 2.5-4-4Z"/><path d="m11 3 5 5-3 3-5-5Z"/><path d="M4 21h6"/>
    </symbol>
      <symbol id="aw-i-trend-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m4 16 5-5 3.5 3.5L20 7"/><path d="M15 7h5v5"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Stat pill</h1>
  <div class="spec">
    <div>
      <div class="cap">Icon + label + value</div>
      <div class="row">
        <span class="aw-stat-pill"><svg class="aw-icon" style="width:18px;height:18px;color:var(--aw-text-accent)" aria-hidden="true"><use href="#aw-i-trend-up"/></svg><span class="aw-stat-pill__label">Watching</span><span class="aw-stat-pill__value">12</span></span>
        <span class="aw-stat-pill"><svg class="aw-icon" style="width:18px;height:18px;color:var(--aw-text-accent)" aria-hidden="true"><use href="#aw-i-gavel"/></svg><span class="aw-stat-pill__label">Active bids</span><span class="aw-stat-pill__value">5</span></span>
      </div>
    </div>
  </div>
</body>
</html>
