<!doctype html>
<!--
  AuctionWire · Plan option  (registry id: plan-option · class: .aw-plan-option · status: verified)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-plan-option .aw-plan-option__body .aw-plan-option__name-row .aw-plan-option__name .aw-plan-option__sub .aw-plan-option__price .aw-plan-option__amount .aw-plan-option__period
  Composes (rules copied for the specimen): .aw-radio (radio), .aw-badge (badge)
  Contract: Foundations components/plan-option.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Plan option</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-text-disabled: #71717a;
    --aw-layout-foreground: #ecedee;
    --aw-positive: #009350;
    --aw-zinc-700: #3f3f46;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-regular: 400;
    --aw-fw-semibold: 600;
    --aw-fw-bold: 700;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-fs-sm: 14px;
    --aw-lh-sm: 20px;
    --aw-fs-base: 16px;
    --aw-lh-base: 24px;
    --aw-fs-xl: 20px;
    --aw-lh-xl: 28px;
    --aw-space-tight: 4px;
    --aw-space-row: 8px;
    --aw-space-block: 12px;
    --aw-space-section: 16px;
    --aw-radius-pill: 9999px;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
    --aw-plan-surface: #18181b;
    --aw-plan-surface-selected: #172e20;
    --aw-plan-border: #3f3f46;
    --aw-radius-plan: 12px;
    --aw-radio-border-width: 2px;
    --aw-radio-dot-size: 8px;
    --aw-chip-h-sm: 24px;
    --aw-chip-h-md: 28px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Element-only reset (specificity 1) so any component class always wins over it. */
  button { font: inherit; cursor: pointer; background: none; border: 0; color: inherit; }

  /* — composed components it sits with (from components/) — */
  /* ── Radio ──────────────────────────────────────────────────────────── */
  /* Measured from the AW Design System Figma set "Radio" (tyqrAWDfmJ8E7yLRmap6VH):
     20px ring, 2px stroke; checked = green stroke + 8px green centre dot. */
  .aw-radio {
    width: 20px; height: 20px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border: var(--aw-radio-border-width) solid var(--aw-zinc-700);
    border-radius: var(--aw-radius-pill); background: transparent;
    transition: border-color var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-radio__dot { width: var(--aw-radio-dot-size); height: var(--aw-radio-dot-size); border-radius: var(--aw-radius-pill); background: transparent; transition: background-color var(--aw-dur-fast) var(--aw-ease-out); }
  .aw-radio.is-checked { border-color: var(--aw-positive); }
  .aw-radio.is-checked .aw-radio__dot { background: var(--aw-positive); }
  /* .aw-radio--ring is kept as an alias for older markup; the ring IS the default now. */
  .aw-radio--ring.is-checked { border-color: var(--aw-positive); }
  .aw-chip {
    display: inline-flex; align-items: center; gap: var(--aw-space-tight);
    height: var(--aw-chip-h-md); padding: 0 var(--aw-space-row);
    border-radius: var(--aw-radius-pill);
    background: var(--aw-surface-strong); color: var(--aw-text-primary);
    outline-offset: 0;
    font-size: var(--aw-fs-sm); line-height: var(--aw-lh-sm); font-weight: var(--aw-fw-regular);
    white-space: nowrap;
  }
  .aw-chip--sm { height: var(--aw-chip-h-sm); font-size: var(--aw-fs-xs); line-height: var(--aw-lh-xs); }
  .aw-chip--primary { background: var(--aw-positive); color: var(--aw-text-primary); }

  /* — component — */
  /* Plan option — selectable subscription plan card.
     Matches the AW Mob V3 "Paywall B" plan rows (Figma B7mJJRaFlVAfLKPTjz48aK · 15780:33003),
     which are built from AW Design System tokens: colors/content/content1 surface, colors/base/default-200
     border, colors/base/primary-50 + 2px primary border when selected, rounded-medium (12) corners. */
  .aw-plan-option {
    display: flex; align-items: center; gap: var(--aw-space-block); width: 100%;
    padding: var(--aw-space-section); border-radius: var(--aw-radius-plan);
    border: 1px solid var(--aw-plan-border); background: var(--aw-plan-surface);
    font-family: var(--aw-font-sans); text-align: left; color: var(--aw-layout-foreground);
    transition: border-color var(--aw-dur-fast) var(--aw-ease-out), background-color var(--aw-dur-fast) var(--aw-ease-out), box-shadow var(--aw-dur-fast) var(--aw-ease-out);
  }
  /* 2px selected border drawn as 1px border + 1px inset ring, so content never shifts */
  .aw-plan-option.is-selected { border-color: var(--aw-positive); box-shadow: inset 0 0 0 1px var(--aw-positive); background: var(--aw-plan-surface-selected); }
  .aw-plan-option__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--aw-space-tight); }
  .aw-plan-option__name-row { display: flex; align-items: center; gap: var(--aw-space-row); }
  .aw-plan-option__name { font-size: var(--aw-fs-base); line-height: var(--aw-lh-base); font-weight: var(--aw-fw-semibold); color: var(--aw-layout-foreground); }
  .aw-plan-option__sub { font-size: var(--aw-fs-xs); line-height: var(--aw-lh-xs); color: var(--aw-text-muted); }
  .aw-plan-option__price { display: flex; align-items: baseline; gap: var(--aw-space-tight); flex: none; font-variant-numeric: tabular-nums; }
  .aw-plan-option__was { font-size: var(--aw-fs-sm); line-height: var(--aw-lh-sm); color: var(--aw-text-disabled); text-decoration: line-through; }
  .aw-plan-option__amount { font-size: var(--aw-fs-xl); line-height: var(--aw-lh-xl); font-weight: var(--aw-fw-bold); color: var(--aw-layout-foreground); }
  .aw-plan-option__period { font-size: var(--aw-fs-xs); line-height: var(--aw-lh-xs); color: var(--aw-text-muted); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Plan option</h1>
  <div class="spec">
    <div>
      <div class="cap">Monthly selected (default) &amp; Annual with a savings chip — Figma Paywall B</div>
      <div class="stack" role="radiogroup" aria-label="Billing plan">
        <button type="button" class="aw-plan-option is-selected" role="radio" aria-checked="true">
          <span class="aw-radio is-checked" aria-hidden="true"><span class="aw-radio__dot"></span></span>
          <span class="aw-plan-option__body">
            <span class="aw-plan-option__name-row"><span class="aw-plan-option__name">Monthly</span></span>
            <span class="aw-plan-option__sub">Billed monthly</span>
          </span>
          <span class="aw-plan-option__price"><span class="aw-plan-option__amount">$15</span><span class="aw-plan-option__period">/mo</span></span>
        </button>
        <button type="button" class="aw-plan-option" role="radio" aria-checked="false">
          <span class="aw-radio" aria-hidden="true"><span class="aw-radio__dot"></span></span>
          <span class="aw-plan-option__body">
            <span class="aw-plan-option__name-row"><span class="aw-plan-option__name">Annual</span><span class="aw-chip aw-chip--primary aw-chip--sm">Save 51%</span></span>
            <span class="aw-plan-option__sub">$7.33/mo · billed yearly</span>
          </span>
          <span class="aw-plan-option__price"><span class="aw-plan-option__amount">$88</span><span class="aw-plan-option__period">/yr</span></span>
        </button>
      </div>
    </div>
    <div>
      <div class="cap">Discount applied (.aw-plan-option__was) — old price struck through</div>
      <div class="stack">
        <button type="button" class="aw-plan-option is-selected" role="radio" aria-checked="true">
          <span class="aw-radio is-checked" aria-hidden="true"><span class="aw-radio__dot"></span></span>
          <span class="aw-plan-option__body"><span class="aw-plan-option__name-row"><span class="aw-plan-option__name">Monthly</span></span><span class="aw-plan-option__sub">Billed monthly</span></span>
          <span class="aw-plan-option__price"><span class="aw-plan-option__was">$15</span><span class="aw-plan-option__amount">$12</span><span class="aw-plan-option__period">/mo</span></span>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
