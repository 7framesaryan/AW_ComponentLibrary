<!doctype html>
<!--
  AuctionWire · Empty state  (registry id: empty · class: .aw-empty · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-empty .aw-empty__icon .aw-empty__title .aw-empty__body
  Composes (rules copied for the specimen): .aw-btn (button)
  Contract: Foundations components/empty.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css, icons/sprite/
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Empty state</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-raised: #27272a;
    --aw-text-primary: #ffffff;
    --aw-text-secondary: #d4d4d8;
    --aw-text-muted: #a1a1aa;
    --aw-text-accent-dim: #42835a;
    --aw-positive: #009350;
    --aw-zinc-500: #71717a;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-medium: 500;
    --aw-fw-semibold: 600;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-fs-base: 16px;
    --aw-lh-base: 24px;
    --aw-space-row: 8px;
    --aw-space-block: 12px;
    --aw-space-section: 16px;
    --aw-space-section-sm: 24px;
    --aw-space-section-lg: 40px;
    --aw-radius-button: 8px;
    --aw-radius-pill: 9999px;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Element-only reset (specificity 1) so any component class always wins over it. */
  button { font: inherit; cursor: pointer; background: none; border: 0; color: inherit; }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — composed components it sits with (from components/) — */
  .aw-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: var(--aw-space-row);
    height: 48px; padding: 0 var(--aw-space-section-sm);
    border: 0; border-radius: var(--aw-radius-button);
    font-family: inherit;
    font-size: var(--aw-fs-base); line-height: var(--aw-lh-base);
    font-weight: var(--aw-fw-medium);
    cursor: pointer;
    transition: opacity var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-btn:active { opacity: 0.7; }
  .aw-btn--outline { background: transparent; color: var(--aw-positive); border: 1px solid var(--aw-positive); }
  .aw-btn--sm { height: 32px; padding: 0 var(--aw-space-block); font-size: var(--aw-fs-xs); line-height: var(--aw-lh-xs); }
  .aw-btn[disabled], .aw-btn.is-disabled {
    background: var(--aw-text-accent-dim); color: var(--aw-zinc-500);
    pointer-events: none;
  }
  .aw-btn--outline[disabled], .aw-btn--outline.is-disabled {
    background: transparent; border-color: var(--aw-text-accent-dim); color: var(--aw-zinc-500);
  }

  /* — component — */
  /* ── Empty / filtered state ───────────────────────────────────────────── */
  .aw-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--aw-space-block); padding: var(--aw-space-section-lg) var(--aw-space-section); }
  .aw-empty__icon { width: 56px; height: 56px; border-radius: var(--aw-radius-pill); background: var(--aw-surface-raised); display: flex; align-items: center; justify-content: center; color: var(--aw-text-muted); }
  .aw-empty__title { font-size: var(--aw-fs-base); font-weight: var(--aw-fw-semibold); color: var(--aw-text-secondary); }
  .aw-empty__body { font-size: var(--aw-fs-xs); color: var(--aw-text-muted); max-width: 34ch; }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 1 symbol this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10.5" cy="10.5" r="7"/><path d="m20 20-4.5-4.5"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Empty state</h1>
  <div class="spec">
    <div>
      <div class="cap">Filtered-out state</div>
      <div class="aw-empty">
        <div class="aw-empty__icon"><svg class="aw-icon" style="width:26px;height:26px" aria-hidden="true"><use href="#aw-i-search"/></svg></div>
        <div class="aw-empty__title">No lots match</div>
        <div class="aw-empty__body">Try widening your price range or clearing a filter.</div>
        <button type="button" class="aw-btn aw-btn--sm aw-btn--outline">Clear filters</button>
      </div>
    </div>
  </div>
</body>
</html>
