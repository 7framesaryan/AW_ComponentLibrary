<!doctype html>
<!--
  AuctionWire · Bottom action bar  (registry id: action-bar · class: .aw-action-bar · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-action-bar
  Composes (rules copied for the specimen): .aw-btn (button)
  Contract: Foundations components/action-bar.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Bottom action bar</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-glass-bar-alt: #00000033;
    --aw-border-ghost: #ffffff26;
    --aw-text-primary: #ffffff;
    --aw-text-accent-dim: #42835a;
    --aw-positive: #009350;
    --aw-zinc-50: #fafafa;
    --aw-zinc-500: #71717a;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-medium: 500;
    --aw-fs-base: 16px;
    --aw-lh-base: 24px;
    --aw-space-row: 8px;
    --aw-space-section: 16px;
    --aw-space-section-sm: 24px;
    --aw-radius-button: 8px;
    --aw-shadow-primary-glow: 0 4px 12px 0 #00935033;
    --aw-glass-blur-sheet: 30px;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Element-only reset (specificity 1) so any component class always wins over it. */
  button { font: inherit; cursor: pointer; background: none; border: 0; color: inherit; }
  .aw-glass-sheet {
    background: var(--aw-surface-glass-bar-alt);
    backdrop-filter: blur(var(--aw-glass-blur-sheet));
    -webkit-backdrop-filter: blur(var(--aw-glass-blur-sheet));
  }

  /* — composed components it sits with (from components/) — */
  .aw-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: var(--aw-space-row);
    height: 48px; padding: 0 var(--aw-space-section-sm);
    border: 0; border-radius: var(--aw-radius-button);
    font-family: inherit;
    font-size: var(--aw-fs-base); line-height: var(--aw-lh-base);
    font-weight: var(--aw-fw-medium);
    cursor: pointer;
    transition: opacity var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-btn:active { opacity: 0.7; }
  .aw-btn--primary { background: var(--aw-positive); color: var(--aw-zinc-50); }
  .aw-btn--primary:hover { box-shadow: var(--aw-shadow-primary-glow); } /* glow max once per screen */
  .aw-btn--full { width: 100%; }
  .aw-btn[disabled], .aw-btn.is-disabled {
    background: var(--aw-text-accent-dim); color: var(--aw-zinc-500);
    pointer-events: none;
  }

  /* — component — */
  /* ── Bottom action bar (glass, holds the primary CTA) ─────────────────── */
  .aw-action-bar {
    padding: var(--aw-space-section);
    border-top: 1px solid var(--aw-border-ghost);
  }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Bottom action bar</h1>
  <div class="spec">
    <div>
      <div class="cap">Bottom action bar (on .aw-glass-sheet) holding the primary CTA</div>
      <div class="aw-action-bar aw-glass-sheet">
        <button type="button" class="aw-btn aw-btn--primary aw-btn--full">Place Bid — $3,900</button>
      </div>
    </div>
  </div>
</body>
</html>
