<!doctype html>

  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-success-heading .aw-success-heading__text
  Contract: Foundations components/success-heading.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Success heading</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-text-primary: #ffffff;
    --aw-text-high: #fafafa;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-bold: 700;
    --aw-feedback-heading-ink-offset: 1px;
    --aw-fs-2xl: 24px;
    --aw-lh-2xl: 32px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* — component — */
  .aw-success-heading { margin: 0; color: var(--aw-text-high); text-align: center; font-family: var(--aw-font-sans); font-size: var(--aw-fs-2xl); line-height: var(--aw-lh-2xl); font-weight: var(--aw-fw-bold); }
  .aw-success-heading__text { position: relative; top: var(--aw-feedback-heading-ink-offset); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Success heading</h1>
  <div class="spec">
    <div>
      <div class="cap">Heading (24/32 bold, centred)</div>
      <h1 class="aw-success-heading"><span class="aw-success-heading__text">You’re all set</span></h1>
    </div>
  </div>
</body>
</html>
