<!doctype html>
<!--
  AuctionWire · Radio  (registry id: radio · class: .aw-radio · status: verified)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-radio .aw-radio__dot .aw-radio--ring
  Contract: Foundations components/radio.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Radio</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
        --aw-text-primary: #ffffff;
    --aw-positive: #009350;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-radius-pill: 9999px;
    --aw-radio-dot-size: 8px;
    --aw-zinc-700: #3f3f46;
    --aw-radio-border-width: 2px;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* — component — */
  /* ── Radio ──────────────────────────────────────────────────────────── */
  /* Measured from the AW Design System Figma set "Radio" (tyqrAWDfmJ8E7yLRmap6VH):
     20px ring, 2px stroke; checked = green stroke + 8px green centre dot. */
  .aw-radio {
    width: 20px; height: 20px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border: var(--aw-radio-border-width) solid var(--aw-zinc-700);
    border-radius: var(--aw-radius-pill); background: transparent;
    transition: border-color var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-radio__dot { width: var(--aw-radio-dot-size); height: var(--aw-radio-dot-size); border-radius: var(--aw-radius-pill); background: transparent; transition: background-color var(--aw-dur-fast) var(--aw-ease-out); }
  .aw-radio.is-checked { border-color: var(--aw-positive); }
  .aw-radio.is-checked .aw-radio__dot { background: var(--aw-positive); }
  /* .aw-radio--ring is kept as an alias for older markup; the ring IS the default now. */
  .aw-radio--ring.is-checked { border-color: var(--aw-positive); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Radio</h1>
  <div class="spec">
    <div>
      <div class="cap">Checked &amp; unchecked (Figma Radio · size=md)</div>
      <div class="row" role="radiogroup" aria-label="Example">
        <span class="aw-radio is-checked" role="radio" aria-checked="true"><span class="aw-radio__dot"></span></span>
        <span class="aw-radio" role="radio" aria-checked="false"><span class="aw-radio__dot"></span></span>
      </div>
    </div>
  </div>
</body>
</html>
