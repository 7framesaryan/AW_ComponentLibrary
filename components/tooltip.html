<!doctype html>
<!--
  AuctionWire · Tooltip  (registry id: tooltip · class: .aw-tooltip · status: verified)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-tooltip  size .aw-tooltip--sm|--lg
           arrow side .aw-tooltip--arrow-top|-bottom|-left|-right   arrow align .aw-tooltip--arrow-start|-end
  Contract: components/tooltip.md
  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css

  Imported from the AW Design System Figma file tyqrAWDfmJ8E7yLRmap6VH, page "Tooltip": component
  sets "tooltip-composition" 2708:607 (size sm | md | lg), "Tooltip" 2708:977 (the finished
  tooltip, size md, radius md) and "tooltip-arrowPosition" 2784:3400 (12 arrow positions).
  Every value below is measured from those sets. The kit's radius axis (none | sm | lg | full)
  and its soft drop shadows (blur 30 and 42, against the Foundations max of 12) are not imported.
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Tooltip</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-text-primary: #ffffff;
    --aw-positive: #009350;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-regular: 400;
    --aw-fs-xs: 12px;   --aw-lh-xs: 16px;
    --aw-fs-sm: 14px;   --aw-lh-sm: 20px;
    --aw-fs-base: 16px; --aw-lh-base: 24px;
    --aw-space-tight: 4px;
    --aw-space-block: 12px;
    --aw-tooltip-radius: 12px;
    --aw-tooltip-arrow: 10px;
    --aw-tooltip-arrow-radius: 2px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* — component — */
  /* ── Tooltip ──────────────────────────────────────────────────────────── */
  .aw-tooltip {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    padding: var(--aw-space-tight) var(--aw-space-block);
    background: var(--aw-positive);
    border-radius: var(--aw-tooltip-radius);
    font-size: var(--aw-fs-sm); line-height: var(--aw-lh-sm); font-weight: var(--aw-fw-regular);
    color: var(--aw-text-primary);
    white-space: nowrap;
  }
  /* size — md is the default (28 tall) */
  .aw-tooltip--sm { font-size: var(--aw-fs-xs); line-height: var(--aw-lh-xs); }     /* 24 tall */
  .aw-tooltip--lg { font-size: var(--aw-fs-base); line-height: var(--aw-lh-base); } /* 32 tall */

  /* arrow — a 10px square turned 45°, sitting on one edge. The side is the edge that
     points at the target: --arrow-top when the tooltip sits below what it describes. */
  .aw-tooltip[class*="aw-tooltip--arrow-"]::after {
    content: "";
    position: absolute;
    width: var(--aw-tooltip-arrow); height: var(--aw-tooltip-arrow);
    background: inherit;
    border-radius: var(--aw-tooltip-arrow-radius);
    transform: rotate(45deg);
  }
  .aw-tooltip--arrow-top::after,
  .aw-tooltip--arrow-bottom::after { left: calc(50% - var(--aw-tooltip-arrow) / 2); }
  .aw-tooltip--arrow-top::after    { top: calc(var(--aw-space-tight) * -1); }
  .aw-tooltip--arrow-bottom::after { bottom: calc(var(--aw-space-tight) * -1); }
  .aw-tooltip--arrow-left::after,
  .aw-tooltip--arrow-right::after  { top: calc(50% - var(--aw-tooltip-arrow) / 2); }
  .aw-tooltip--arrow-left::after   { left: -3px; }
  .aw-tooltip--arrow-right::after  { right: -3px; }
  /* arrow align — start / end (default centre) */
  .aw-tooltip--arrow-top.aw-tooltip--arrow-start::after,
  .aw-tooltip--arrow-bottom.aw-tooltip--arrow-start::after { left: 18px; }
  .aw-tooltip--arrow-top.aw-tooltip--arrow-end::after,
  .aw-tooltip--arrow-bottom.aw-tooltip--arrow-end::after   { left: auto; right: 18px; }
  .aw-tooltip--arrow-left.aw-tooltip--arrow-start::after,
  .aw-tooltip--arrow-right.aw-tooltip--arrow-start::after  { top: calc(50% - var(--aw-tooltip-arrow) / 2 - 2px); }
  .aw-tooltip--arrow-left.aw-tooltip--arrow-end::after,
  .aw-tooltip--arrow-right.aw-tooltip--arrow-end::after    { top: calc(50% - var(--aw-tooltip-arrow) / 2 + 1px); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 28px; max-width: 560px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 12px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Tooltip</h1>
  <div class="spec">
    <div>
      <div class="cap">Size — sm 24 · md 28 (default) · lg 32</div>
      <div class="row">
        <span class="aw-tooltip aw-tooltip--sm" role="tooltip">Ends in 2h 14m</span>
        <span class="aw-tooltip" role="tooltip">Ends in 2h 14m</span>
        <span class="aw-tooltip aw-tooltip--lg" role="tooltip">Ends in 2h 14m</span>
      </div>
    </div>
    <div>
      <div class="cap">Arrow — top · bottom, each start · centre · end</div>
      <div class="row">
        <span class="aw-tooltip aw-tooltip--arrow-top aw-tooltip--arrow-start" role="tooltip">PSA 10 only</span>
        <span class="aw-tooltip aw-tooltip--arrow-top" role="tooltip">PSA 10 only</span>
        <span class="aw-tooltip aw-tooltip--arrow-top aw-tooltip--arrow-end" role="tooltip">PSA 10 only</span>
      </div>
      <div class="row" style="margin-top:20px">
        <span class="aw-tooltip aw-tooltip--arrow-bottom aw-tooltip--arrow-start" role="tooltip">12 new matches</span>
        <span class="aw-tooltip aw-tooltip--arrow-bottom" role="tooltip">12 new matches</span>
        <span class="aw-tooltip aw-tooltip--arrow-bottom aw-tooltip--arrow-end" role="tooltip">12 new matches</span>
      </div>
    </div>
    <div>
      <div class="cap">Arrow — left · right</div>
      <div class="row">
        <span class="aw-tooltip aw-tooltip--arrow-left" role="tooltip">Tap to save</span>
        <span class="aw-tooltip aw-tooltip--arrow-right" role="tooltip">Tap to save</span>
      </div>
    </div>
  </div>
</body>
</html>
