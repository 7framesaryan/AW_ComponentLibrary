<!doctype html>
<!--
  AuctionWire · Device frame  (registry id: device · class: .aw-device · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-device
  Composes (rules copied for the specimen): .aw-screen (screen), .aw-hero-band (hero-band)
  Contract: Foundations components/device.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Device frame</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-text-primary: #ffffff;
    --aw-zinc-800: #27272a;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-bold: 700;
    --aw-fs-xl: 20px;
    --aw-lh-xl: 28px;
    --aw-space-section: 16px;
    --aw-radius-screen: 60px;
    --aw-grad-hero: linear-gradient(180deg, #171a17 0%, #121412 100%);
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-page-title    { font-size: var(--aw-fs-xl);   line-height: var(--aw-lh-xl);   font-weight: var(--aw-fw-bold);     color: var(--aw-text-primary); }

  /* — composed components it sits with (from components/) — */
  .aw-screen {
    background: var(--aw-bg);
    min-height: 100%;
    padding: 0 var(--aw-space-section);
  }
  .aw-hero-band { background: var(--aw-grad-hero); }

  /* — component — */
  /* ── Device / screen frame (web preview surface) ──────────────────────── */
  .aw-device {
    width: 402px;
    max-width: 100%;
    background: var(--aw-bg);
    border-radius: var(--aw-radius-screen);
    border: 1px solid var(--aw-zinc-800);
    overflow: hidden;
    position: relative;
  }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Device frame</h1>
  <div class="spec">
    <div>
      <div class="cap">402px preview frame (60px screen radius) with a hero band and a screen inside</div>
      <div class="aw-device" style="height:420px">
        <div class="aw-hero-band" style="height:100%">
          <div class="aw-screen" style="background:transparent;padding-top:64px">
            <div class="aw-page-title">Watchlist</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
