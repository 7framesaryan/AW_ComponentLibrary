<!doctype html>
<!--
  AuctionWire · Stat card  (registry id: stat-card · class: .aw-stat-card · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-stat-card
  Contract: Foundations components/stat-card.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Stat card</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface: #18181b;
    --aw-border-hairline: #52525b;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-regular: 400;
    --aw-fw-bold: 700;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-fs-base: 16px;
    --aw-lh-base: 24px;
    --aw-space-tight: 4px;
    --aw-space-section: 16px;
    --aw-grid-columns: 4;
    --aw-grid-margin: 16px;
    --aw-grid-gutter: 8px;
    --aw-radius-card: 8px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-stat-value    { font-size: var(--aw-fs-base); line-height: var(--aw-lh-base);  font-weight: var(--aw-fw-bold);   color: var(--aw-text-primary); }
  .aw-body-muted    { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-regular);  color: var(--aw-text-muted); }
  .aw-grid { display: grid; grid-template-columns: repeat(var(--aw-grid-columns), minmax(0, 1fr)); column-gap: var(--aw-grid-gutter); padding-inline: var(--aw-grid-margin); }
  .aw-col-2 { grid-column: span 2; }

  /* — component — */
  .aw-stat-card {
    border-radius: var(--aw-radius-card);
    border: 1px solid var(--aw-border-hairline);
    background: var(--aw-surface); padding: var(--aw-space-section);
    display: flex; flex-direction: column; gap: var(--aw-space-tight);
  }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Stat card</h1>
  <div class="spec">
    <div>
      <div class="cap">2-up on the grid</div>
      <div class="aw-grid" style="padding-inline:0">
        <div class="aw-stat-card aw-col-2"><span class="aw-body-muted">Cards</span><span class="aw-stat-value">128</span></div>
        <div class="aw-stat-card aw-col-2"><span class="aw-body-muted">Active bids</span><span class="aw-stat-value">5</span></div>
      </div>
    </div>
  </div>
</body>
</html>
