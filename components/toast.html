<!doctype html>
<!--
  AuctionWire · Toast  (registry id: toast · class: .aw-toast · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-toast  color .aw-toast--primary  parts __icon __content __title __description __action __close
  Contract: components/toast.md
  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css
  Built on the AW Design System Figma file tyqrAWDfmJ8E7yLRmap6VH. Imported from the kit Toast [WIP] sets 3592:7898 (composition) and 3592:7961 (colour): padding 12,
  gap 16, radius md 16; default-100 fill, primary = primary-50.
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Toast</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-text-primary: #ffffff;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-space-section: 16px;
    --aw-space-block: 12px;
    --aw-toast-radius: 16px;
    --aw-surface-raised: #27272a;
    --aw-layout-foreground: #ecedee;
    --aw-shadow-hairline: 0 1px 0 0 #0000004d;
    --aw-primary-50: #172e20;
    --aw-toast-icon: 24px;
    --aw-text-accent: #009350;
    --aw-fs-sm: 14px;
    --aw-lh-sm: 20px;
    --aw-fw-medium: 500;
    --aw-fw-regular: 400;
    --aw-text-secondary: #d4d4d8;
    --aw-toast-close: 16px;
    --aw-radius-pill: 9999px;
    --aw-border-small: 1px;
    --aw-border-hairline: #52525b;
    --aw-icon-xs: 12px;
    --aw-space-row: 8px;
    --aw-btn-h-md: 40px;
    --aw-radius-button: 8px;
    --aw-dur-fast: 120ms;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-btn-icon-size: 20px;
    --aw-btn-h-sm: 32px;
    --aw-btn-h-lg: 48px;
    --aw-space-section-sm: 24px;
    --aw-positive: #009350;
    --aw-primary-400: #42835a;
    --aw-primary-100: #244431;
    --aw-btn-radius-md: 12px;
    --aw-btn-radius-lg: 14px;
    --aw-primary-600: #72bb8e;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }

  /* — component — */
  /* ── Toast ─────────────────────────────────────────────────────────────── */
  .aw-toast {
    display: flex; align-items: center; gap: var(--aw-space-section);
    padding: var(--aw-space-block); border-radius: var(--aw-toast-radius);
    background: var(--aw-surface-raised); color: var(--aw-layout-foreground);
    font-family: var(--aw-font-sans); box-shadow: var(--aw-shadow-hairline);
  }
  .aw-toast--primary { background: var(--aw-primary-50); }
  .aw-toast__icon { flex: none; width: var(--aw-toast-icon); height: var(--aw-toast-icon); color: var(--aw-text-accent); }
  .aw-toast__content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .aw-toast__title { margin: 0; font-size: var(--aw-fs-sm); line-height: var(--aw-lh-sm); font-weight: var(--aw-fw-medium); color: var(--aw-layout-foreground); }
  .aw-toast__description { margin: 0; font-size: var(--aw-fs-sm); line-height: var(--aw-lh-sm); font-weight: var(--aw-fw-regular); color: var(--aw-text-secondary); }
  .aw-toast__action { flex: none; }
  .aw-toast__close { flex: none; display: grid; place-items: center; width: var(--aw-toast-close); height: var(--aw-toast-close); padding: 0; border-radius: var(--aw-radius-pill); background: var(--aw-surface-raised); border: var(--aw-border-small) solid var(--aw-border-hairline); color: var(--aw-text-secondary); cursor: pointer; }
  .aw-toast__close .aw-icon { width: var(--aw-icon-xs); height: var(--aw-icon-xs); }

  /* — other components the specimens use (copied from their own files; not this component) — */
  /* ── Button ───────────────────────────────────────────────────────────── */
  .aw-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: var(--aw-space-row);
    height: var(--aw-btn-h-md); padding: 0 var(--aw-space-section);
    border: 0; border-radius: var(--aw-radius-button);
    background: transparent;
    font-family: inherit;
    font-size: var(--aw-fs-sm); line-height: var(--aw-lh-sm); font-weight: var(--aw-fw-regular);
    color: var(--aw-text-primary);
    cursor: pointer;
    transition: background-color var(--aw-dur-fast) var(--aw-ease-out), border-color var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-btn .aw-icon { width: var(--aw-btn-icon-size); height: var(--aw-btn-icon-size); }

  /* size */
  .aw-btn--sm { height: var(--aw-btn-h-sm); padding: 0 var(--aw-space-block); }
  .aw-btn--lg { height: var(--aw-btn-h-lg); padding: 0 var(--aw-space-section-sm); }

  /* type — Primary: solid fill */
  .aw-btn--primary { background: var(--aw-positive); }
  .aw-btn--primary:hover { background: var(--aw-primary-400); }
  .aw-btn--primary[disabled], .aw-btn--primary.is-disabled { background: var(--aw-primary-100); pointer-events: none; }

  /* type — Secondary: 1px outline, no fill */
  .aw-btn--secondary { border: 1px solid var(--aw-positive); }
  .aw-btn--secondary:hover { border-color: var(--aw-primary-400); }
  .aw-btn--secondary[disabled], .aw-btn--secondary.is-disabled { border-color: var(--aw-primary-100); pointer-events: none; }

  /* type — Tertiary: label only. The set gives it no hover or disabled treatment */
  .aw-btn--tertiary { background: transparent; border: 0; }
  .aw-btn--tertiary[disabled], .aw-btn--tertiary.is-disabled { pointer-events: none; }

  /* radius — the set's radius axis (default is its radius=sm) */
  .aw-btn--r-none { border-radius: 0; }
  .aw-btn--r-md { border-radius: var(--aw-btn-radius-md); }
  .aw-btn--r-lg { border-radius: var(--aw-btn-radius-lg); }
  .aw-btn--r-full { border-radius: var(--aw-radius-pill); }

  /* icon-only — square, no padding */
  .aw-btn--icon { width: var(--aw-btn-h-md); padding: 0; }
  .aw-btn--icon.aw-btn--sm { width: var(--aw-btn-h-sm); }
  .aw-btn--icon.aw-btn--lg { width: var(--aw-btn-h-lg); }
  .aw-btn--icon.aw-btn--primary { background: var(--aw-primary-600); }
  .aw-btn--icon.aw-btn--primary:hover { background: var(--aw-primary-400); }
  .aw-btn--icon.aw-btn--primary[disabled], .aw-btn--icon.aw-btn--primary.is-disabled { background: var(--aw-primary-100); }

  /* width */
  .aw-btn--full { width: 100%; }
  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>

      <symbol id="aw-i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="aw-i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 10.5c0-3.6-2.9-6.5-6.5-6.5S5.5 6.9 5.5 10.5c0 1-.3 2-.8 2.8L3.4 15.6c-.9 1.4 0 3.2 1.6 3.6 4.5 1.2 9.5 1.2 14 0 1.6-.4 2.5-2.2 1.6-3.6l-1.3-2.3c-.5-.8-.8-1.8-.8-2.8Z"/>

    </defs>
  </svg>

  <h1>AuctionWire · Toast</h1>
  <div class="spec">
    <div>
      <div class="cap">Primary · title + description + close</div>
      <div class="aw-toast aw-toast--primary" role="status">
        <svg class="aw-icon aw-toast__icon" aria-hidden="true"><use href="#aw-i-bookmark-filled"/></svg>
        <div class="aw-toast__content"><p class="aw-toast__title">Search saved</p><p class="aw-toast__description">We’ll alert you when a new card matches.</p></div>
        <button class="aw-toast__close" aria-label="Dismiss"><svg class="aw-icon" aria-hidden="true"><use href="#aw-i-close"/></svg></button>
      </div>
    </div>
    <div>
      <div class="cap">Default · with an action</div>
      <div class="aw-toast" role="status">
        <svg class="aw-icon aw-toast__icon" aria-hidden="true"><use href="#aw-i-bell"/></svg>
        <div class="aw-toast__content"><p class="aw-toast__title">Search removed</p></div>
        <button class="aw-btn aw-btn--sm aw-toast__action">Undo</button>
      </div>
    </div>
  </div>
</body>
</html>
