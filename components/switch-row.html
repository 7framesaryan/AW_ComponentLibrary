<!doctype html>
<!--
  AuctionWire · Switch row  (registry id: switch-row · class: .aw-switch-row · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-switch-row  parts __icon __text __label __description (+ an .aw-switch)
  Contract: components/switch-row.md
  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css
  Built on the AW Design System Figma file tyqrAWDfmJ8E7yLRmap6VH. Composed from the kit Switch (1818:363) and text styles; not in the kit yet: flagged 2026-09-28.
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Switch row</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-text-primary: #ffffff;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-space-block: 12px;
    --aw-space-section: 16px;
    --aw-rounded-medium: 12px;
    --aw-surface-raised: #27272a;
    --aw-btn-icon-size: 20px;
    --aw-text-secondary: #d4d4d8;
    --aw-fs-sm: 14px;
    --aw-lh-sm: 20px;
    --aw-fw-medium: 500;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-text-muted: #a1a1aa;
    --aw-space-row: 8px;
    --aw-switch-w-sm: 40px;
    --aw-switch-h-sm: 24px;
    --aw-radius-pill: 9999px;
    --aw-surface-strong: #3f3f46;
    --aw-dur-fast: 120ms;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-space-tight: 4px;
    --aw-switch-thumb-sm: 16px;
    --aw-white: #ffffff;
    --aw-shadow-hairline: 0 1px 0 0 #0000004d;
    --aw-positive: #009350;
    --aw-fs-base: 16px;
    --aw-lh-base: 24px;
    --aw-switch-w-md: 48px;
    --aw-switch-h-md: 28px;
    --aw-switch-thumb-md: 20px;
    --aw-switch-w-lg: 56px;
    --aw-switch-h-lg: 32px;
    --aw-switch-thumb-lg: 24px;
    --aw-opacity-disabled: 0.5;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }

  /* — component — */
  /* ── Switch row ────────────────────────────────────────────────────────── */
  .aw-switch-row {
    display: flex; align-items: center; gap: var(--aw-space-block);
    padding: var(--aw-space-block) var(--aw-space-section);
    border-radius: var(--aw-rounded-medium); background: var(--aw-surface-raised);
    font-family: var(--aw-font-sans);
  }
  .aw-switch-row__icon { flex: none; width: var(--aw-btn-icon-size); height: var(--aw-btn-icon-size); color: var(--aw-text-secondary); }
  .aw-switch-row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .aw-switch-row__label { font-size: var(--aw-fs-sm); line-height: var(--aw-lh-sm); font-weight: var(--aw-fw-medium); color: var(--aw-text-primary); }
  .aw-switch-row__description { font-size: var(--aw-fs-xs); line-height: var(--aw-lh-xs); color: var(--aw-text-muted); }

  /* — other components the specimens use (copied from their own files; not this component) — */
  /* ── Switch ───────────────────────────────────────────────────────────
     Kit-aligned 2026-09-28: the AW Design System Switch (1818:363), color=primary.
     4px track padding; the thumb sits right when on. sm is the default. */
  .aw-switch { display: inline-flex; align-items: center; gap: var(--aw-space-row); cursor: pointer; }
  .aw-switch__track {
    position: relative; flex: none;
    width: var(--aw-switch-w-sm); height: var(--aw-switch-h-sm); border-radius: var(--aw-radius-pill);
    background: var(--aw-surface-strong);
    transition: background var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-switch__thumb {
    position: absolute; top: var(--aw-space-tight); left: var(--aw-space-tight);
    width: var(--aw-switch-thumb-sm); height: var(--aw-switch-thumb-sm);
    border-radius: var(--aw-radius-pill); background: var(--aw-white); box-shadow: var(--aw-shadow-hairline);
    transition: transform var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-switch.is-on .aw-switch__track { background: var(--aw-positive); }
  .aw-switch.is-on .aw-switch__thumb { transform: translateX(calc(var(--aw-switch-w-sm) - var(--aw-switch-thumb-sm) - 2 * var(--aw-space-tight))); }
  .aw-switch__label { font-size: var(--aw-fs-base); line-height: var(--aw-lh-base); color: var(--aw-text-secondary); }
  /* size */
  .aw-switch--md .aw-switch__track { width: var(--aw-switch-w-md); height: var(--aw-switch-h-md); }
  .aw-switch--md .aw-switch__thumb { width: var(--aw-switch-thumb-md); height: var(--aw-switch-thumb-md); }
  .aw-switch--md.is-on .aw-switch__thumb { transform: translateX(calc(var(--aw-switch-w-md) - var(--aw-switch-thumb-md) - 2 * var(--aw-space-tight))); }
  .aw-switch--lg .aw-switch__track { width: var(--aw-switch-w-lg); height: var(--aw-switch-h-lg); }
  .aw-switch--lg .aw-switch__thumb { width: var(--aw-switch-thumb-lg); height: var(--aw-switch-thumb-lg); }
  .aw-switch--lg.is-on .aw-switch__thumb { transform: translateX(calc(var(--aw-switch-w-lg) - var(--aw-switch-thumb-lg) - 2 * var(--aw-space-tight))); }
  .aw-switch.is-disabled { opacity: var(--aw-opacity-disabled); cursor: default; }
  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 10.5c0-3.6-2.9-6.5-6.5-6.5S5.5 6.9 5.5 10.5c0 1-.3 2-.8 2.8L3.4 15.6c-.9 1.4 0 3.2 1.6 3.6 4.5 1.2 9.5 1.2 14 0 1.6-.4 2.5-2.2 1.6-3.6l-1.3-2.3c-.5-.8-.8-1.8-.8-2.8Z"/>
  <path d="M9.5 20.5c.6 1.5 2 2.5 3.5 2.5s2.9-1 3.5-2.5"/>
  <path d="M12 6v4"/></symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Switch row</h1>
  <div class="spec">
    <div>
      <div class="cap">Setting with a description</div>
      <label class="aw-switch-row">
        <svg class="aw-icon aw-switch-row__icon" aria-hidden="true"><use href="#aw-i-bell"/></svg>
        <span class="aw-switch-row__text"><span class="aw-switch-row__label">Alert me about new matches</span><span class="aw-switch-row__description">Push notification</span></span>
        <span class="aw-switch is-on" role="switch" aria-checked="true"><span class="aw-switch__track"><span class="aw-switch__thumb"></span></span></span>
      </label>
    </div>
  </div>
</body>
</html>
