<!doctype html>
<!--
  AuctionWire · Fact row  (registry id: fact-row · class: .aw-fact-row · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-fact-row .aw-fact-row__label .aw-icon .aw-fact-row__value
  Composes (rules copied for the specimen): .aw-listing-card (listing-card)
  Contract: Foundations components/fact-row.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css, icons/sprite/
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Fact row</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-text-warning-dim: #936316;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fs-sm: 14px;
    --aw-space-micro: 2px;
    --aw-space-tight: 4px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — composed components it sits with (from components/) — */
  .aw-listing-card__facts { display: flex; flex-direction: column; gap: var(--aw-space-micro); }

  /* — component — */
  .aw-fact-row { display: flex; align-items: center; gap: var(--aw-space-tight); }
  .aw-fact-row__label { font-size: var(--aw-fs-sm); color: var(--aw-text-muted); }
  .aw-fact-row .aw-icon { color: var(--aw-text-warning-dim); }
  .aw-fact-row__value { font-size: var(--aw-fs-sm); color: var(--aw-text-primary); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 1 symbol this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Fact row</h1>
  <div class="spec">
    <div>
      <div class="cap">Cost facts (in a listing card's facts stack)</div>
      <div class="aw-listing-card__facts">
        <div class="aw-fact-row"><span class="aw-fact-row__label">Buyers Premium:</span><span class="aw-fact-row__value">+20% ($770)</span></div>
        <div class="aw-fact-row"><span class="aw-fact-row__label">Total:</span><span class="aw-fact-row__value">$4,620</span></div>
      </div>
    </div>
    <div>
      <div class="cap">With a lock icon (gated value)</div>
      <div class="aw-fact-row"><span class="aw-fact-row__label">Seller:</span><svg class="aw-icon" style="width:12px;height:12px" aria-hidden="true"><use href="#aw-i-lock"/></svg></div>
    </div>
  </div>
</body>
</html>
