<!doctype html>
<!--
  AuctionWire · Field  (registry id: field · class: .aw-field · status: verified)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-field .aw-field__label .aw-field__input .aw-field__hint
  Contract: Foundations components/field.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Field</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface: #18181b;
    --aw-border-subtle: #27272a;
    --aw-border-strong: #71717a;
    --aw-border-primary: #009350;
    --aw-border-danger: #d4183d;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-text-disabled: #71717a;
    --aw-text-danger: #d4183d;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-medium: 500;
    --aw-fs-caption: 10px;
    --aw-fs-xs: 12px;
    --aw-fs-sm: 14px;
    --aw-space-tight: 4px;
    --aw-space-section: 16px;
    --aw-radius-search-lg: 12px;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
    --aw-text-secondary: #d4d4d8;
    --aw-border-hairline: #52525b;
    --aw-layout-foreground: #ecedee;
    --aw-fw-regular: 400;
    --aw-lh-xs: 16px;
    --aw-fs-base: 16px;
    --aw-lh-base: 24px;
    --aw-space-block: 12px;
    --aw-field-h: 46px;
    --aw-field-border-width: 2px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* — component — */
  /* ── Text field (forms / auth) ────────────────────────────────────────── */
  /* Measured from the AW Design System Figma set "Input" (variant=bordered, size=lg, radius=md,
     labelPlacement=outside): label 12/16 regular above a transparent field with a 2px border. */
  .aw-field { display: flex; flex-direction: column; gap: var(--aw-space-block); }
  .aw-field__label { font-size: var(--aw-fs-xs); line-height: var(--aw-lh-xs); font-weight: var(--aw-fw-regular); color: var(--aw-text-secondary); transition: color var(--aw-dur-fast) var(--aw-ease-out); }
  .aw-field__input {
    width: 100%; height: var(--aw-field-h); padding: 0 var(--aw-space-block);
    border-radius: var(--aw-radius-search-lg);
    background: transparent; border: var(--aw-field-border-width) solid var(--aw-border-hairline);
    color: var(--aw-layout-foreground); font-family: inherit; font-size: var(--aw-fs-base); line-height: var(--aw-lh-base); outline: none;
    transition: border-color var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-field__input::placeholder { color: var(--aw-text-muted); }
  .aw-field__input:focus { border-color: var(--aw-border-primary); }
  .aw-field:focus-within .aw-field__label, .aw-field.is-active .aw-field__label { color: var(--aw-text-accent); }
  .aw-field.is-active .aw-field__input { border-color: var(--aw-border-primary); }
  .aw-field.is-error .aw-field__input { border-color: var(--aw-border-danger); }
  .aw-field__hint { font-size: var(--aw-fs-caption); color: var(--aw-text-muted); }
  .aw-field.is-error .aw-field__hint { color: var(--aw-text-danger); }
  .aw-field__input[disabled] { color: var(--aw-text-disabled); border-color: var(--aw-border-subtle); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Field</h1>
  <div class="spec">
    <div class="stack">
      <div class="cap">Empty (placeholder) · filled · active · error · disabled — Figma Input bordered / lg / outside label</div>
      <label class="aw-field"><span class="aw-field__label">Promo code</span><input class="aw-field__input" placeholder="Enter promo code"></label>
      <label class="aw-field"><span class="aw-field__label">Email address</span><input class="aw-field__input" value="alex.wills@acme.com"></label>
      <label class="aw-field is-active"><span class="aw-field__label">Promo code</span><input class="aw-field__input" value="COLLECTOR20"></label>
      <label class="aw-field is-error"><span class="aw-field__label">Max bid</span><input class="aw-field__input" value="$50"><span class="aw-field__hint">Must be higher than the current bid ($3,850)</span></label>
      <label class="aw-field"><span class="aw-field__label">Username</span><input class="aw-field__input" value="collector" disabled></label>
    </div>
  </div>
</body>
</html>
