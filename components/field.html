<!doctype html>
<!--
  AuctionWire · Field  (registry id: field · class: .aw-field · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-field .aw-field__label .aw-field__input .aw-field__hint
  Contract: Foundations components/field.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Field</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-text-primary: #ffffff;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-space-tight: 4px;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-fw-regular: 400;
    --aw-text-secondary: #d4d4d8;
    --aw-input-h-lg: 48px;
    --aw-space-block: 12px;
    --aw-rounded-medium: 12px;
    --aw-border-medium: 2px;
    --aw-border-hairline: #52525b;
    --aw-layout-foreground: #ecedee;
    --aw-fs-base: 16px;
    --aw-lh-base: 24px;
    --aw-dur-fast: 120ms;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-text-muted: #a1a1aa;
    --aw-border-primary: #009350;
    --aw-surface-raised: #27272a;
    --aw-surface-strong: #3f3f46;
    --aw-input-h-sm: 40px;
    --aw-fs-sm: 14px;
    --aw-lh-sm: 20px;
    --aw-text-disabled: #71717a;
    --aw-border-danger: #d4183d;
    --aw-text-danger: #d4183d;
    --aw-opacity-disabled: 0.5;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* — component — */
  /* ── Text field ───────────────────────────────────────────────────────
     Kit-aligned 2026-09-28: the AW Design System Input (2702:198295), labelPlacement=outside,
     size=lg. Default = variant=bordered (2px foreground-300 stroke, primary when focused);
     .aw-field--flat = variant=flat (default-100 fill). */
  .aw-field { display: flex; flex-direction: column; gap: var(--aw-space-tight); }
  .aw-field__label { font-size: var(--aw-fs-xs); line-height: var(--aw-lh-xs); font-weight: var(--aw-fw-regular); color: var(--aw-text-secondary); }
  .aw-field__input {
    height: var(--aw-input-h-lg); padding: 0 var(--aw-space-block);
    border-radius: var(--aw-rounded-medium);
    background: transparent; border: var(--aw-border-medium) solid var(--aw-border-hairline);
    color: var(--aw-layout-foreground); font-family: var(--aw-font-sans); font-size: var(--aw-fs-base); line-height: var(--aw-lh-base); outline: none;
    transition: border-color var(--aw-dur-fast) var(--aw-ease-out), background var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-field__input::placeholder { color: var(--aw-text-muted); }
  .aw-field__input:focus { border-color: var(--aw-border-primary); }
  .aw-field--flat .aw-field__input { background: var(--aw-surface-raised); border-color: transparent; }
  .aw-field--flat .aw-field__input:hover { background: var(--aw-surface-strong); }
  .aw-field--flat .aw-field__input:focus { border-color: var(--aw-border-primary); }
  .aw-field--sm .aw-field__input { height: var(--aw-input-h-sm); font-size: var(--aw-fs-sm); line-height: var(--aw-lh-sm); }
  .aw-field__hint { font-size: var(--aw-fs-xs); line-height: var(--aw-lh-xs); color: var(--aw-text-disabled); }
  .aw-field.is-error .aw-field__input { border-color: var(--aw-border-danger); }
  .aw-field.is-error .aw-field__hint { color: var(--aw-text-danger); }
  .aw-field__input[disabled] { opacity: var(--aw-opacity-disabled); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Field</h1>
  <div class="spec">
    <div>
      <div class="cap">Default</div>
      <label class="aw-field"><span class="aw-field__label">Email</span><input class="aw-field__input" placeholder="you@example.com"><span class="aw-field__hint">We'll send a sign-in code.</span></label>
    </div>
    <div>
      <div class="cap">Focus (click into it)</div>
      <label class="aw-field"><span class="aw-field__label">Max bid</span><input class="aw-field__input" value="$4,000"></label>
    </div>
    <div>
      <div class="cap">Error (.is-error)</div>
      <label class="aw-field is-error"><span class="aw-field__label">Max bid</span><input class="aw-field__input" value="$50"><span class="aw-field__hint">Must be higher than the current bid ($3,850)</span></label>
    </div>
    <div>
      <div class="cap">Disabled</div>
      <label class="aw-field"><span class="aw-field__label">Auction house</span><input class="aw-field__input" value="Heritage" disabled></label>
    </div>
  </div>
</body>
</html>
