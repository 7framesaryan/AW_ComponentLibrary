<!doctype html>
<!--
  AuctionWire · Filter chip  (registry id: filter-chip · class: .aw-filter-chip · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-filter-chip
  Contract: Foundations components/filter-chip.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css, icons/sprite/
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Filter chip</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-raised: #27272a;
    --aw-surface-strong: #3f3f46;
    --aw-border-strong: #71717a;
    --aw-text-primary: #ffffff;
    --aw-text-secondary: #d4d4d8;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-medium: 500;
    --aw-fs-chip: 11px;
    --aw-space-tight: 4px;
    --aw-space-block: 12px;
    --aw-radius-pill: 9999px;
    --aw-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
    --aw-dur-fast: 120ms;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — component — */
  /* Filter pill — solid, selectable */
  .aw-filter-chip {
    display: inline-flex; align-items: center; gap: var(--aw-space-tight);
    height: 28px; padding: 0 var(--aw-space-block);
    border-radius: var(--aw-radius-pill);
    background: var(--aw-surface-raised); color: var(--aw-text-secondary);
    font-size: var(--aw-fs-chip); font-weight: var(--aw-fw-medium);
    flex: none; white-space: nowrap;
    transition: background var(--aw-dur-fast) var(--aw-ease-out);
  }
  .aw-filter-chip.is-active { background: var(--aw-surface-strong); color: var(--aw-text-primary); border: 1px solid var(--aw-border-strong); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 1 symbol this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-sort" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 5v14M7 19l-3-3M7 5l3 3M17 19V5M17 5l3 3M17 19l-3-3"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Filter chip</h1>
  <div class="spec">
    <div>
      <div class="cap">Default &amp; active (.is-active)</div>
      <div class="row">
        <span class="aw-filter-chip is-active"><svg class="aw-icon" style="width:12px;height:12px" aria-hidden="true"><use href="#aw-i-sort"/></svg>Ending soon</span>
        <span class="aw-filter-chip">Baseball</span>
        <span class="aw-filter-chip">PSA 9+</span>
      </div>
    </div>
  </div>
</body>
</html>
