<!doctype html>
<!--
  AuctionWire · Search  (registry id: search · class: .aw-search · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-search .aw-search__input .aw-search--sm .aw-search__icon
  Contract: Foundations components/search.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css, icons/sprite/
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Search</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-surface-translucent: #00000066;
    --aw-surface-search-small: #333333b3;
    --aw-border-primary: #009350;
    --aw-text-primary: #ffffff;
    --aw-text-secondary: #d4d4d8;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-medium: 500;
    --aw-fs-sm: 14px;
    --aw-space-row: 8px;
    --aw-space-section: 16px;
    --aw-radius-search-sm: 8px;
    --aw-radius-search-lg: 12px;
    --aw-glass-blur-search: 12px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-icon { display: inline-block; vertical-align: middle; color: currentColor; flex: none; }
  .aw-icon svg { display: block; width: 100%; height: 100%; }

  /* — component — */
  /* ── Search field ─────────────────────────────────────────────────────── */
  .aw-search {
    display: flex; align-items: center; gap: var(--aw-space-row);
    height: 48px; padding: 0 var(--aw-space-section);
    border-radius: var(--aw-radius-search-lg);
    background: var(--aw-surface-translucent);
    backdrop-filter: blur(var(--aw-glass-blur-search));
    -webkit-backdrop-filter: blur(var(--aw-glass-blur-search));
    border: 1px solid transparent;
    color: var(--aw-text-secondary);
  }
  .aw-search__input {
    flex: 1; background: none; border: 0; outline: none;
    font-size: var(--aw-fs-sm); font-weight: var(--aw-fw-medium);
    color: var(--aw-text-primary);
  }
  .aw-search__input::placeholder { color: var(--aw-text-secondary); }
  .aw-search.is-focused { border-color: var(--aw-border-primary); box-shadow: inset 0 0 0 1px var(--aw-border-primary); }
  .aw-search--sm {
    height: 40px; border-radius: var(--aw-radius-search-sm);
    background: var(--aw-surface-search-small);
  }
  .aw-search__icon { color: var(--aw-text-secondary); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <!-- icon sprite: only the 1 symbol this component uses (from the Foundations icons/sprite/) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="aw-i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10.5" cy="10.5" r="7"/><path d="m20 20-4.5-4.5"/>
    </symbol>
    </defs>
  </svg>

  <h1>AuctionWire · Search</h1>
  <div class="spec">
    <div>
      <div class="cap">Default (48px, glass)</div>
      <label class="aw-search"><svg class="aw-icon aw-search__icon" style="width:20px;height:20px" aria-hidden="true"><use href="#aw-i-search"/></svg><input class="aw-search__input" placeholder="Search cards, players, sets…"></label>
    </div>
    <div>
      <div class="cap">Focused (.is-focused)</div>
      <label class="aw-search is-focused"><svg class="aw-icon aw-search__icon" style="width:20px;height:20px" aria-hidden="true"><use href="#aw-i-search"/></svg><input class="aw-search__input" value="Mantle 1952"></label>
    </div>
    <div>
      <div class="cap">Small (.aw-search--sm, in-page)</div>
      <label class="aw-search aw-search--sm"><svg class="aw-icon aw-search__icon" style="width:18px;height:18px" aria-hidden="true"><use href="#aw-i-search"/></svg><input class="aw-search__input" placeholder="Search watchlist"></label>
    </div>
  </div>
</body>
</html>
