<!doctype html>
<!--
  AuctionWire · Detail row  (registry id: detail-row · class: .aw-detail-row · status: catalogued)
  Coded component — self-contained. Carries ONLY the tokens, primitives and icons it uses,
  so it drops straight into a Claude artifact without the whole token file.
  Classes: .aw-detail-row .aw-detail-row__meta
  Contract: Foundations components/detail-row.md  ·  Styling source: this file (the "component" marker in its <style>) + Foundations src/tokens.css, src/base.css
  THIS FILE IS THE SOURCE. The rules under the "component" marker below are its styling;
  screen builds read that block straight out of this file. Edit it here, nowhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionWire · Detail row</title>
<style>
  /* — tokens this component actually uses — */
  :root {
    --aw-bg: #040501;
    --aw-border-subtle: #27272a;
    --aw-text-primary: #ffffff;
    --aw-text-muted: #a1a1aa;
    --aw-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --aw-fw-regular: 400;
    --aw-fw-semibold: 600;
    --aw-fs-xs: 12px;
    --aw-lh-xs: 16px;
    --aw-fs-sm: 14px;
    --aw-lh-sm: 20px;
    --aw-fs-lg: 18px;
    --aw-space-micro: 2px;
    --aw-space-block: 12px;
  }

  /* — shared primitives this component leans on (Foundations base.css) — */
  *,
  *::before,
  *::after { box-sizing: border-box; }
  .aw-root {
    font-family: var(--aw-font-sans);
    color: var(--aw-text-primary);
    background: var(--aw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .aw-price-lead    { font-size: var(--aw-fs-lg);   font-weight: var(--aw-fw-semibold); color: var(--aw-text-primary); }
  .aw-body-muted    { font-size: var(--aw-fs-xs);   line-height: var(--aw-lh-xs);   font-weight: var(--aw-fw-regular);  color: var(--aw-text-muted); }
  .aw-list-label-strong{ font-size: var(--aw-fs-sm); line-height: var(--aw-lh-sm); font-weight: var(--aw-fw-semibold); color: var(--aw-text-primary); }

  /* — component — */
  /* ── Detail rows (price history / population) ─────────────────────────── */
  .aw-detail-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--aw-space-block) 0;
    border-bottom: 1px solid var(--aw-border-subtle);
  }
  .aw-detail-row__meta { display: flex; flex-direction: column; gap: var(--aw-space-micro); }

  /* — specimen scaffold (not part of the component) — */
  body { margin: 0; padding: 28px; min-height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: #a1a1aa; letter-spacing: .02em; }
  .spec { display: grid; gap: 22px; max-width: 402px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 11px; color: #71717a; margin-bottom: 8px; }
</style>
</head>
<body class="aw-root">
  <h1>AuctionWire · Detail row</h1>
  <div class="spec">
    <div>
      <div class="cap">Price history rows (last row border removed inline, as in templates)</div>
      <div>
        <div class="aw-detail-row"><div class="aw-detail-row__meta"><span class="aw-list-label-strong">Jan 2026</span><span class="aw-body-muted">Heritage · 31 bids</span></div><span class="aw-price-lead" style="font-size:16px">$3,600</span></div>
        <div class="aw-detail-row"><div class="aw-detail-row__meta"><span class="aw-list-label-strong">Oct 2025</span><span class="aw-body-muted">Goldin · 22 bids</span></div><span class="aw-price-lead" style="font-size:16px">$3,250</span></div>
        <div class="aw-detail-row" style="border:0"><div class="aw-detail-row__meta"><span class="aw-list-label-strong">Aug 2025</span><span class="aw-body-muted">PWCC · 19 bids</span></div><span class="aw-price-lead" style="font-size:16px">$2,900</span></div>
      </div>
    </div>
  </div>
</body>
</html>
